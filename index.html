<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MYLife – Personal Dashboard & Growth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    /* iPhone: Eingabefelder unter 16px lösen automatisches Reinzoomen aus */
    @media (max-width: 640px) {
      input, select, textarea { font-size: 16px !important; }
    }
    .perf-sheet { max-height: 92vh; max-height: 92dvh; }
    .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    #perf-modal-body { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  </style>
</head>
<body class="h-full font-sans antialiased selection:bg-blue-500 selection:text-white">

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
    <div class="glass w-full max-w-md p-8 rounded-3xl shadow-2xl space-y-6 border border-slate-800">
      <div class="text-center space-y-2">
        <div class="inline-flex p-3 bg-blue-600/20 text-blue-400 rounded-2xl mb-2">
          <i data-lucide="sparkles" class="w-8 h-8"></i>
        </div>
        <h1 class="text-3xl font-black tracking-tight text-white">MYLife</h1>
        <p class="text-slate-400 text-sm">Dein persönliches Entwicklungs-Dashboard</p>
      </div>

      <div class="flex p-1 bg-slate-900/80 rounded-xl text-sm font-medium border border-slate-800">
        <button id="tab-login-btn" onclick="showAuthTab('login')" class="flex-1 py-2 rounded-lg bg-blue-600 text-white transition">Anmelden</button>
        <button id="tab-register-btn" onclick="showAuthTab('register')" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition">Registrieren</button>
      </div>

      <!-- Form Login -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Benutzername</label>
          <input type="text" id="login-user" required class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Passwort</label>
          <input type="password" id="login-pass" required class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
        </div>
        <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition">Anmelden</button>
      </form>

      <!-- Form Register -->
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Name / Benutzername</label>
          <input type="text" id="reg-name" required class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Schule / Schulsystem</label>
          <select id="reg-school" class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white focus:outline-none focus:border-blue-500 transition">
            <option value="WMS">WMS (Wirtschaftsmittelschule EFZ/BM)</option>
            <option value="Andere">Andere Schule</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Passwort festlegen</label>
          <input type="password" id="reg-pass" required class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
        </div>
        <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition">Account Erstellen</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen" class="hidden min-h-screen flex flex-col">
    <header class="glass sticky top-0 z-40 border-b border-slate-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-blue-600/20 text-blue-400 rounded-xl">
            <i data-lucide="sparkles" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-wider text-white">MYLife</h1>
            <p id="user-greeting" class="text-xs text-slate-400">Hallo</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button onclick="openAddModuleModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-lg shadow-blue-600/20">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Modul hinzufügen</span>
          </button>
          
          <button onclick="openProfileModal()" class="flex items-center gap-2 p-1.5 bg-slate-900 border border-slate-800 rounded-xl hover:border-blue-500 transition">
            <img id="nav-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-8 h-8 rounded-lg object-cover">
            <span id="nav-username" class="text-sm font-medium text-slate-200 hidden md:inline">Profil</span>
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
      <div id="perf-overview"></div>
      <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>
  </div>

  <!-- MODAL: PERFORMANCE (Fitness, Fußball, Social, Hygiene, Fotos) -->
  <div id="modal-perf" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-end sm:items-center justify-center sm:p-4 hidden">
    <div class="glass perf-sheet w-full sm:max-w-2xl rounded-t-3xl sm:rounded-3xl border border-slate-800 flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-800 px-5 py-4 shrink-0">
        <h3 id="perf-modal-title" class="text-lg font-bold text-white flex items-center gap-2"></h3>
        <button onclick="closePerfModal()" class="text-slate-400 hover:text-white p-1" aria-label="Schliessen"><i data-lucide="x"></i></button>
      </div>
      <div id="perf-modal-body" class="min-h-0 overflow-y-auto px-4 sm:px-5 pt-4 pb-safe"></div>
    </div>
  </div>

  <!-- MODAL: MODULE VERWALTEN -->
  <div id="modal-add-module" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-xl p-6 rounded-3xl border border-slate-800 space-y-6">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h3 class="text-xl font-bold text-white flex items-center gap-2">
          <i data-lucide="layout-grid" class="text-blue-400"></i> Module Verwalten
        </h3>
        <button onclick="closeModal('modal-add-module')" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
      </div>
      <div id="available-modules-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-96 overflow-y-auto p-1"></div>
    </div>
  </div>

  <!-- MODAL: NEUES SEMESTER -->
  <div id="modal-add-semester" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-md p-6 rounded-3xl border border-slate-800 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="folder-plus" class="text-blue-400"></i> Neues Semester
        </h3>
        <button onclick="closeModal('modal-add-semester')" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Semester Name</label>
        <input type="text" id="new-semester-name" placeholder="z. B. 1. Semester 2026" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-blue-500">
      </div>
      <button onclick="saveSemester()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition">Erstellen</button>
    </div>
  </div>

  <!-- MODAL: NEUES FACH -->
  <div id="modal-add-subject" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-md p-6 rounded-3xl border border-slate-800 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="book-open" class="text-blue-400"></i> Neues Fach
        </h3>
        <button onclick="closeModal('modal-add-subject')" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Fach Name</label>
        <input type="text" id="new-subject-name" placeholder="z. B. Mathematik, Deutsch, W&R" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Fach-Kategorie</label>
        <select id="new-subject-type" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-blue-500">
          <option value="BM">BM-Fach (Berufsmaturität: max. 2 ungenügende, max. 2.0 Minuspunkte)</option>
          <option value="EFZ">EFZ-Fach (Eidg. Fähigkeitszeugnis: max. 1 ungenügende)</option>
        </select>
      </div>
      <button onclick="saveSubject()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition">Fach Hinzufügen</button>
    </div>
  </div>

  <!-- MODAL: NEUE PRÜFUNG -->
  <div id="modal-add-exam" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-md p-6 rounded-3xl border border-slate-800 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="file-text" class="text-blue-400"></i> Note / Prüfung eintragen
        </h3>
        <button onclick="closeModal('modal-add-exam')" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Prüfungsbezeichnung (Optional)</label>
        <input type="text" id="new-exam-title" placeholder="z.B. Test 1" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-blue-500 mb-3 text-sm">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Erreichte Punkte</label>
          <input type="number" step="0.5" id="new-exam-achieved" placeholder="45" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Maximale Punkte</label>
          <input type="number" step="0.5" id="new-exam-max" placeholder="50" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>
      <p class="text-xs text-slate-400">Formel: <code class="text-blue-400">1 + 5 * (Erreicht / Max)</code> (Gerundet auf 0.5)</p>
      <button onclick="saveExam()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition">Berechnen & Speichern</button>
    </div>
  </div>

  <!-- MODAL: STECKBRIEF / PROFIL -->
  <div id="modal-profile" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-xl p-6 rounded-3xl border border-slate-800 space-y-6 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h3 class="text-xl font-bold text-white flex items-center gap-2">
          <i data-lucide="user" class="text-blue-400"></i> Mein Steckbrief
        </h3>
        <button onclick="closeModal('modal-profile')" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
      </div>

      <form onsubmit="saveProfile(event)" class="space-y-4">
        <div class="flex items-center gap-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
          <img id="edit-profile-img-preview" src="" class="w-16 h-16 rounded-2xl object-cover bg-slate-800 border border-slate-700">
          <div class="flex-1 space-y-2">
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Profilbild hochladen</label>
              <input type="file" accept="image/*" onchange="handleFileUpload(event)" class="text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:bg-blue-600 file:text-white file:font-semibold hover:file:bg-blue-500 cursor-pointer">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Oder Profilbild URL</label>
              <input type="text" id="edit-profile-pic" oninput="updateProfilePicPreview(this.value)" placeholder="https://..." class="w-full px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Name</label>
            <input type="text" id="edit-profile-name" required class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Alter</label>
            <input type="number" id="edit-profile-age" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Gewicht (kg)</label>
            <input type="number" id="edit-profile-weight" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Grösse (cm)</label>
            <input type="number" id="edit-profile-height" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Zielgewicht (kg)</label>
          <input type="number" id="edit-profile-target-weight" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white" placeholder="75">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Hauptziel im Leben</label>
          <input type="text" id="edit-profile-goal" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Motto</label>
          <input type="text" id="edit-profile-motto" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white italic">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Über mich</label>
          <textarea id="edit-profile-bio" rows="3" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white"></textarea>
        </div>

        <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 space-y-2">
          <label class="block text-xs font-semibold uppercase text-slate-400">Datensicherung</label>
          <p class="text-[11px] text-slate-500">Deine Daten liegen nur auf diesem Gerät. Exportiere regelmässig ein Backup (inkl. Fotos).</p>
          <div class="flex gap-2">
            <button type="button" onclick="exportBackup()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl transition">Backup exportieren</button>
            <label class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl transition text-center cursor-pointer">Backup importieren
              <input type="file" accept="application/json,.json" class="hidden" onchange="importBackup(event)">
            </label>
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 font-bold text-white rounded-xl transition">Speichern</button>
          <button type="button" onclick="handleLogout()" class="px-4 py-3 bg-rose-600/20 text-rose-400 border border-rose-500/30 rounded-xl font-bold hover:bg-rose-600/30 transition">Abmelden</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;
    let activeSemIdx = null;
    let activeSubIdx = null;
    let weightChartInstance = null;

    const DEFAULT_AVATAR = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100';

    const TARGETS = {
      kcal: 2500,
      protein: 150,
      carbs: 300,
      fat: 80,
      sugarMax: 40,
      saltMax: 6,
      water: 3.0
    };

    const MODULE_DEFINITIONS = [
      { id: 'wms_grades', name: 'WMS Notensystem', icon: 'graduation-cap', desc: 'Semester, EFZ/BM Fächer, Minuspunkte-Check & Bestehensregeln' },
      { id: 'nutrition', name: 'Ernährung & Gesundheit', icon: 'apple', desc: 'Nährwert-Tracker, Health-Score, Intelligente Lebensmittel-Empfehlungen & Gewichtsverlauf' },
      { id: 'budget', name: 'Budget & Finanzen', icon: 'wallet', desc: 'Monatliche Einnahmen & Ausgaben in CHF' },
      { id: 'fitness', name: 'Fitness & Routine', icon: 'dumbbell', desc: 'Trainings mit Übungen, Sätzen & Wdh. – automatischer Fortschrittsvergleich' },
      { id: 'football', name: 'Fußball', icon: 'trophy', desc: 'Dribbling, Schuss, Pässe, Sprint & Matches – Analyse pro Kategorie' },
      { id: 'social_media', name: 'Social Media Creator', icon: 'share-2', desc: 'TikTok, Instagram & YouTube – Posting-Ziel & Plattform-Analyse' },
      { id: 'lifestyle', name: 'Hygiene & Aussehen', icon: 'sparkles', desc: 'Duschen, Nägel, Pflege & eigene Routinen mit Verlauf' },
      { id: 'face_progress', name: 'Gesichtsentwicklung', icon: 'scan-face', desc: 'Foto-Tagebuch mit Vorher/Nachher-Vergleich' },
      { id: 'weather', name: 'Wetter (Vorbereitet)', icon: 'cloud-sun', desc: 'Platzhalter für zukünftiges Wetter-Widget' },
      { id: 'calendar', name: 'Kalender (Vorbereitet)', icon: 'calendar', desc: 'Platzhalter für Termine & Tagesziele' },
      { id: 'news', name: 'Welt-News (Vorbereitet)', icon: 'newspaper', desc: 'Platzhalter für Schlagzeilen' }
    ];

    window.onload = function() {
      lucide.createIcons();
      checkAuthSession();
    };

    function checkAuthSession() {
      const savedUser = localStorage.getItem('mylife_active_user');
      if (savedUser) {
        currentUser = JSON.parse(localStorage.getItem('mylife_user_' + savedUser));
        if (currentUser) {
          showApp();
          return;
        }
      }
      showAuthScreen();
    }

    function showAuthTab(tab) {
      document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
      document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
      document.getElementById('tab-login-btn').className = tab === 'login' ? 'flex-1 py-2 rounded-lg bg-blue-600 text-white transition' : 'flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition';
      document.getElementById('tab-register-btn').className = tab === 'register' ? 'flex-1 py-2 rounded-lg bg-emerald-600 text-white transition' : 'flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition';
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const school = document.getElementById('reg-school').value;
      const pass = document.getElementById('reg-pass').value;

      if (!name || !pass) return;

      const userKey = 'mylife_user_' + name.toLowerCase();
      if (localStorage.getItem(userKey)) {
        alert('Benutzername existiert bereits!');
        return;
      }

      currentUser = {
        username: name.toLowerCase(),
        password: pass,
        profile: {
          name: name,
          school: school,
          age: 17,
          weight: 68,
          targetWeight: 75,
          height: 180,
          goal: 'WMS (BM & EFZ) erfolgreich abschliessen',
          motto: 'Jeden Tag 1% besser!',
          bio: 'Mein persönliches Dashboard.',
          pic: DEFAULT_AVATAR
        },
        activeModules: ['wms_grades', 'nutrition', 'budget'],
        semesters: [],
        budget: [],
        weightHistory: [],
        nutritionLogs: []
      };

      saveUserData();
      localStorage.setItem('mylife_active_user', currentUser.username);
      showApp();
    }

    function handleLogin(e) {
      e.preventDefault();
      const name = document.getElementById('login-user').value.trim().toLowerCase();
      const pass = document.getElementById('login-pass').value;

      const userData = localStorage.getItem('mylife_user_' + name);
      if (!userData) {
        alert('Benutzer nicht gefunden!');
        return;
      }

      const user = JSON.parse(userData);
      if (user.password !== pass) {
        alert('Falsches Passwort!');
        return;
      }

      currentUser = user;
      localStorage.setItem('mylife_active_user', currentUser.username);
      showApp();
    }

    function handleLogout() {
      localStorage.removeItem('mylife_active_user');
      currentUser = null;
      closeModal('modal-profile');
      showAuthScreen();
    }

    function saveUserData() {
      if (currentUser) {
        try {
          localStorage.setItem('mylife_user_' + currentUser.username, JSON.stringify(currentUser));
        } catch (e) {
          alert('Speichern fehlgeschlagen: Der Speicher des Browsers ist voll. Exportiere ein Backup im Steckbrief und lösche alte Einträge.');
        }
      }
    }

    function showAuthScreen() {
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('app-screen').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      ensurePerfData();
      updateNavProfile();
      renderDashboard();
    }

    function updateNavProfile() {
      const userPic = (currentUser.profile && currentUser.profile.pic && currentUser.profile.pic.trim() !== '') ? currentUser.profile.pic : DEFAULT_AVATAR;
      document.getElementById('user-greeting').innerText = 'Hallo, ' + currentUser.profile.name;
      document.getElementById('nav-username').innerText = currentUser.profile.name;
      document.getElementById('nav-avatar').src = userPic;

    function renderDashboard() {
      const grid = document.getElementById('dashboard-grid');
      grid.innerHTML = '';

      currentUser.activeModules.forEach(modId => {
        const card = document.createElement('div');
        card.className = "glass rounded-3xl p-6 border border-slate-800 space-y-4 flex flex-col justify-between";
        card.innerHTML = getModuleHTML(modId);
        grid.appendChild(card);
      });

      renderPerfOverview();
      lucide.createIcons();
      hydratePhotos(document.getElementById('app-screen'));

      if (currentUser.activeModules.includes('nutrition')) {
        initWeightChart();
      }

    function getModuleHTML(modId) {
      const modDef = MODULE_DEFINITIONS.find(m => m.id === modId);
      if (!modDef) return '';
      let contentHTML = '';

      if (modId === 'wms_grades') {
        contentHTML = renderWMSGradesContent();
      } else if (modId === 'nutrition') {
        contentHTML = renderNutritionContent();
      } else if (modId === 'budget') {
        contentHTML = renderBudgetContent();
      } else if (modId === 'fitness') {
        contentHTML = renderFitnessCard();
      } else if (modId === 'football') {
        contentHTML = renderFootballCard();
      } else if (modId === 'social_media') {
        contentHTML = renderSocialCard();
      } else if (modId === 'lifestyle') {
        contentHTML = renderHygieneCard();
      } else if (modId === 'face_progress') {
        contentHTML = renderFaceCard();
      } else {
        contentHTML = `<p class="text-sm text-slate-400 italic">${modDef.desc}</p><span class="inline-block px-3 py-1 bg-slate-900 text-slate-500 text-xs rounded-full border border-slate-800">Platzhalter</span>`;
      }

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2">
              <i data-lucide="${modDef.icon}" class="text-blue-400 w-5 h-5"></i>

    }

    function analyzeAndSaveNutrition() {
      const kcal = parseFloat(document.getElementById('nutr-kcal').value) || 0;
      const protein = parseFloat(document.getElementById('nutr-protein').value) || 0;
      const carbs = parseFloat(document.getElementById('nutr-carbs').value) || 0;
      const fat = parseFloat(document.getElementById('nutr-fat').value) || 0;
      const sugar = parseFloat(document.getElementById('nutr-sugar').value) || 0;
      const salt = parseFloat(document.getElementById('nutr-salt').value) || 0;
      const water = parseFloat(document.getElementById('nutr-water').value) || 0;

      let score = 100;
      const statusList = document.getElementById('nutr-status-list');
      const recsContainer = document.getElementById('smart-recommendations');
      recsContainer.innerHTML = '';

      function makeBadge(label, val, target, unit, isMax = false) {
        let isOk = isMax ? val <= target : val >= target;
        if (!isOk) score -= 12;
        const colorClass = isOk ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border-rose-500/30';
        return `
          <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 flex justify-between items-center">
            <span class="text-slate-400">${label}:</span>
            <span class="px-2 py-0.5 rounded-lg border font-bold text-[11px] ${colorClass}">
              ${val}${unit} ${isOk ? '✓' : '✕'}
            </span>
          </div>
        `;
      }

      statusList.innerHTML = `
        ${makeBadge('Kcal', kcal, TARGETS.kcal - 200, '')}
        ${makeBadge('Protein', protein, TARGETS.protein, 'g')}
        ${makeBadge('Carbs', carbs, TARGETS.carbs - 50, 'g')}
        ${makeBadge('Fett', fat, TARGETS.fat - 15, 'g')}
        ${makeBadge('Zucker', sugar, TARGETS.sugarMax, 'g', true)}
        ${makeBadge('Salz', salt, TARGETS.saltMax, 'g', true)}
        ${makeBadge('Wasser', water, TARGETS.water, 'L')}
      `;

      // SPECIFIC RECOMMENDATIONS ENGINE
      let recsHTML = '';

      // 1. Kalorien Defizit
      if (kcal < TARGETS.kcal - 200) {
        recsHTML += `
          <div class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-2xl text-xs space-y-1 text-amber-200">
            <div class="flex items-center gap-1.5 font-bold text-amber-400">
              <i data-lucide="flame" class="w-4 h-4"></i> Zu wenig Kalorien!

            <p class="text-[11px] text-amber-300/90">Du musst heute mehr essen, um dein Ziel von ${TARGETS.kcal} kcal zu erreichen. Gute Kalorienbomben: <strong>Erdnussbutter, Nüsse, Haferflocken oder Vollkornbrot</strong>.</p>
          </div>
        `;
      }

      // 2. Protein Defizit
      if (protein < TARGETS.protein) {
        recsHTML += `
          <div class="bg-indigo-500/10 border border-indigo-500/30 p-3 rounded-2xl text-xs space-y-1 text-indigo-200">
            <div class="flex items-center gap-1.5 font-bold text-indigo-400">
              <i data-lucide="dumbbell" class="w-4 h-4"></i> Protein-Defizit!
            </div>
            <p class="text-[11px] text-indigo-300/90">Empfohlene proteinreiche Lebensmittel:</p>
            <ul class="list-disc list-inside text-[11px] space-y-0.5 text-indigo-200/90">
              <li><strong>Whey 30g</strong> (~24g Protein)</li>
              <li><strong>Griechischer Joghurt 200g</strong> (~19g Protein)</li>
              <li><strong>Eier (3 Stück)</strong> (~19g Protein)</li>
              <li><strong>Milch 500ml</strong> (~17g Protein)</li>
              <li><strong>Haferflocken 100g</strong> (~17g Protein)</li>
            </ul>
          </div>
        `;
      }

      // 3. Kohlenhydrate Defizit
      if (carbs < TARGETS.carbs - 50) {
        recsHTML += `
          <div class="bg-blue-500/10 border border-blue-500/30 p-3 rounded-2xl text-xs space-y-1 text-blue-200">
            <div class="flex items-center gap-1.5 font-bold text-blue-400">
              <i data-lucide="zap" class="w-4 h-4"></i> Kohlenhydrate-Defizit!
            </div>
            <p class="text-[11px] text-blue-300/90">Empfohlene Kohlenhydrat-Lieferanten:</p>
            <ul class="list-disc list-inside text-[11px] space-y-0.5 text-blue-200/90">
              <li><strong>Gekochter Reis 300g</strong> (~84g Carbs)</li>
              <li><strong>Haferflocken 100g</strong> (~66g Carbs)</li>
              <li><strong>Vollkornbrot 100g</strong> (~40g Carbs)</li>
              <li><strong>Banane (1 Stück)</strong> (~28g Carbs - schnelle Energie)</li>
            </ul>
          </div>
        `;

      // 4. Fett Defizit
      if (fat < TARGETS.fat - 15) {
        recsHTML += `
          <div class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-2xl text-xs space-y-1 text-amber-200">
            <div class="flex items-center gap-1.5 font-bold text-amber-400">
              <i data-lucide="shield" class="w-4 h-4"></i> Gesunde Fette nachfüllen!

            <p class="text-[11px] text-amber-300/90">Empfohlene fettreiche Lebensmittel:</p>
            <ul class="list-disc list-inside text-[11px] space-y-0.5 text-amber-200/90">
              <li><strong>Nüsse 30g</strong> (~18g Fett)</li>
              <li><strong>Erdnussbutter 30g</strong> (~15g Fett)</li>
              <li><strong>Eier (3 Stück)</strong> (~15g Fett)</li>
              <li><strong>Milch 500ml</strong> (~15g Fett)</li>
            </ul>
          </div>
        `;

      // 5. Zucker zu hoch
      if (sugar > TARGETS.sugarMax) {
        recsHTML += `
          <div class="bg-rose-500/10 border border-rose-500/30 p-3 rounded-2xl text-xs space-y-1 text-rose-200">
            <div class="flex items-center gap-1.5 font-bold text-rose-400">

          </div>

      }

      // 6. Salz zu hoch
      if (salt > TARGETS.saltMax) {
        recsHTML += `
          <div class="bg-rose-500/10 border border-rose-500/30 p-3 rounded-2xl text-xs space-y-1 text-rose-200">
            <div class="flex items-center gap-1.5 font-bold text-rose-400">
              <i data-lucide="alert-triangle" class="w-4 h-4"></i> Zu viel Salz!
            </div>
            <p class="text-[11px] text-rose-300/90">Bitte reduziere den Konsum von stark gesalzenen Fertiggerichten, Chips oder Soßen.</p>
          </div>
        `;
      }

      // 7. Wasser zu wenig
      if (water < TARGETS.water) {
        recsHTML += `
          <div class="bg-cyan-500/10 border border-cyan-500/30 p-3 rounded-2xl text-xs space-y-1 text-cyan-200">

            <p class="text-[11px] text-cyan-300/90">Trinke noch mehr Wasser! Mindestens ${TARGETS.water} Liter pro Tag sichern maximale körperliche und mentale Leistungsfähigkeit.</p>
          </div>
        `;
      }

      recsContainer.innerHTML = recsHTML;
      lucide.createIcons();

      score = Math.max(0, score);
      document.getElementById('health-score-val').innerText = score;
      const badge = document.getElementById('health-score-badge');
      if (score >= 80) {
        badge.className = "px-3 py-1 rounded-xl text-base font-black bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
      } else {
        badge.className = "px-3 py-1 rounded-xl text-base font-black bg-rose-500/20 text-rose-400 border border-rose-500/30";
      }
    }

    function initWeightChart() {
      const canvas = document.getElementById('weightChartCanvas');
      if (!canvas) return;

      const history = currentUser.weightHistory || [];
      const labels = history.map(h => h.date);
      const dataVals = history.map(h => h.val);
      const targetWeight = currentUser.profile.targetWeight || 75;
      const targetVals = history.map(() => targetWeight);

      if (weightChartInstance) {
        weightChartInstance.destroy();
      }

      const ctx = canvas.getContext('2d');
      weightChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Gewicht (kg)',
              data: dataVals,
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.1)',
              fill: true,
              tension: 0.3
            },
            {
              label: 'Ziel (' + targetWeight + ' kg)',
              data: targetVals,
              borderColor: '#f43f5e',
              borderDash: [5, 5],
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          scales: {
            y: { min: 50, max: 100, ticks: { color: '#94a3b8' } },
            x: { ticks: { color: '#94a3b8' } }
          },
          plugins: {
            legend: { labels: { color: '#94a3b8', boxWidth: 12 } }
          }
        }
      });
    }

    function addWeightEntry() {
      const date = document.getElementById('weight-date').value;
      const val = parseFloat(document.getElementById('weight-val').value);

      if (!date || isNaN(val) || val <= 0) {
        return alert('Bitte gültiges Datum und Gewicht eintragen!');
      }

      if (!currentUser.weightHistory) currentUser.weightHistory = [];
      currentUser.weightHistory.push({ date, val });
      currentUser.profile.weight = val;

      saveUserData();
      renderDashboard();
    }

    // ---------------- WMS / EFZ / BM NOTENSYSTEM ENGINE ----------------
    function roundToHalfGrade(val) {
      return Math.round(val * 2) / 2;
    }

    function renderWMSGradesContent() {
      let html = `
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Semester-Übersicht</span>
            <button onclick="openSemesterModal()" class="text-xs bg-blue-600/20 text-blue-400 border border-blue-500/30 px-3 py-1.5 rounded-xl font-bold hover:bg-blue-600 hover:text-white transition">+ Neues Semester</button>
          </div>
      `;

      if (!currentUser.semesters || currentUser.semesters.length === 0) {
        html += `<p class="text-xs text-slate-500 italic">Noch kein Semester angelegt. Klicke oben auf "+ Neues Semester".</p></div>`;
        return html;
      }

      currentUser.semesters.forEach((sem, semIdx) => {
        let subjectsHTML = '';
        let totalSubjectGrades = 0;
        let validSubjectsCount = 0;

        let bmUngenuegendCount = 0;
        let efzUngenuegendCount = 0;
        let minuspunkteTotal = 0;

        if (sem.subjects && sem.subjects.length > 0) {
          sem.subjects.forEach((sub, subIdx) => {
            let examSum = 0;
            let examCount = 0;

            if (sub.exams && sub.exams.length > 0) {
              sub.exams.forEach(ex => {
                const rawGrade = 1 + 5 * (ex.achieved / ex.max);
                const roundedGrade = roundToHalfGrade(rawGrade);
                examSum += roundedGrade;
                examCount++;
              });

  <script>

    // =====================================================================
    // ==================  MYLIFE PERFORMANCE ENGINE  ======================
    // Fitness, Fußball, Social Media, Hygiene & Aussehen, Gesichtsentwicklung
    // Daten: currentUser.perf (localStorage) + Fotos in IndexedDB
    // =====================================================================

    // ---------- Allgemeine Helfer ----------
    const INP = 'w-full bg-slate-950 border border-slate-700 px-3 py-2 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500';
    const LBL = 'block text-[10px] font-bold uppercase text-slate-400 mb-1';
    const BOX = 'bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800 space-y-3';
    const BTN_PRIMARY = 'w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition text-sm';
    const BTN_GHOST = 'py-2 px-3 bg-slate-900 border border-slate-700 hover:border-blue-500 text-slate-200 font-semibold rounded-xl transition text-xs';

    function chipCls(active, color = 'blue') {
      const on = {
        blue: 'bg-blue-600 text-white border-blue-500',
        emerald: 'bg-emerald-600 text-white border-emerald-500',
        pink: 'bg-pink-600 text-white border-pink-500'
      }[color];
      return 'px-3 py-2 rounded-xl border text-xs font-semibold transition ' +
        (active ? on : 'bg-slate-900 text-slate-300 border-slate-700 hover:border-blue-500');
    }

    function esc(s) {
      return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // akzeptiert "18,4" und "18.4" (iPhone-Tastatur liefert oft Komma)
    function num(v) {
      if (v === null || v === undefined) return null;
      const s = String(v).trim().replace(',', '.');
      if (s === '') return null;
      const n = parseFloat(s);
      return isFinite(n) ? n : null;
    }

    function fmtN(n, d = 2) {
      if (n === null || n === undefined || !isFinite(n)) return '–';
      return Number(n).toLocaleString('de-DE', { maximumFractionDigits: d });
    }

    function fmtDate(iso) {
      if (!iso) return '–';
      const p = iso.split('-');
      return `${p[2]}.${p[1]}.${p[0]}`;
    }

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

    function isoFromDate(dt) {
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }
    function dateFromIso(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
    function addDays(iso, n) { const dt = dateFromIso(iso); dt.setDate(dt.getDate() + n); return isoFromDate(dt); }
    function daysBetween(a, b) { return Math.round((dateFromIso(b) - dateFromIso(a)) / 86400000); }
    function weekStart(iso) { const dt = dateFromIso(iso); const wd = (dt.getDay() + 6) % 7; dt.setDate(dt.getDate() - wd); return isoFromDate(dt); }
    const WEEKDAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

    function sortChrono(arr) {
      return (arr || []).slice().sort((a, b) =>
        a.date === b.date ? (a.createdAt || 0) - (b.createdAt || 0) : (a.date < b.date ? -1 : 1));
    }
    function lastOf(arr) { const s = sortChrono(arr); return s.length ? s[s.length - 1] : null; }

    // Vorheriger Eintrag (chronologisch vor "entry"), optional mit Filter
    function previousOf(list, entry, predicate) {
      const sorted = sortChrono(list);
      const idx = sorted.findIndex(e => e.id === entry.id);
      for (let i = (idx === -1 ? sorted.length : idx) - 1; i >= 0; i--) {
        if (!predicate || predicate(sorted[i])) return sorted[i];
      }
      return null;
    }

    function mean(a) { return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null; }
    function rate(s, a) { return a ? (s / a) * 100 : null; }

    // ---------- Vergleichs-System ----------
    function cmpVal(cur, prev, higherBetter = true) {
      if (cur === null || cur === undefined) return { status: 'none' };
      if (prev === null || prev === undefined) return { status: 'first', cur };
      const delta = cur - prev;
      const status = Math.abs(delta) < 1e-9 ? 'same' : ((delta > 0) === higherBetter ? 'better' : 'worse');
      const pct = prev !== 0 ? (delta / Math.abs(prev)) * 100 : null;
      return { status, cur, prev, delta, pct };
    }

    const STATUS_UI = {
      better: { e: '🟢', cls: 'text-emerald-400', bg: 'bg-emerald-500/10 border-emerald-500/30', word: 'Verbesserung' },
      worse:  { e: '🔴', cls: 'text-rose-400',    bg: 'bg-rose-500/10 border-rose-500/30',       word: 'Verschlechterung' },
      same:   { e: '🟡', cls: 'text-amber-300',   bg: 'bg-amber-500/10 border-amber-500/30',     word: 'Gleich geblieben' },
      mixed:  { e: '🟡', cls: 'text-amber-300',   bg: 'bg-amber-500/10 border-amber-500/30',     word: 'Nicht direkt vergleichbar' },
      first:  { e: '⚪', cls: 'text-slate-400',   bg: 'bg-slate-800/40 border-slate-700',        word: 'Erster Eintrag' },
      none:   { e: '–',  cls: 'text-slate-500',   bg: 'bg-slate-800/40 border-slate-700',        word: 'Nicht trainiert' }
    };

    // opts: { d, unit, pct (bool), time (bool: "schneller/langsamer"), deltaUnit }
    function cmpRow(label, c, opts = {}) {
      if (!c || c.status === 'none') return '';
      const d = opts.d === undefined ? 2 : opts.d;
      const unit = opts.unit || '';
      const ui = STATUS_UI[c.status];
      let deltaTxt;
      if (c.status === 'first') deltaTxt = 'Erster Wert';
      else if (c.status === 'same') deltaTxt = 'Gleich';
      else if (opts.time) deltaTxt = `${fmtN(Math.abs(c.delta), d)}${unit} ${c.delta < 0 ? 'schneller' : 'langsamer'}`;
      else {
        deltaTxt = `${c.delta > 0 ? '+' : '−'}${fmtN(Math.abs(c.delta), d)}${opts.deltaUnit || unit}`;
        if (opts.pct && c.pct !== null) deltaTxt += ` (${c.pct > 0 ? '+' : '−'}${fmtN(Math.abs(c.pct), 1)} %)`;
      }
      return `
        <div class="flex items-center justify-between gap-2 bg-slate-950/70 px-3 py-2 rounded-xl border border-slate-800 text-xs">
          <div class="min-w-0">
            <div class="text-slate-300 font-semibold truncate">${esc(label)}</div>
            <div class="text-[11px] text-slate-500">${c.status === 'first' ? '' : `vorher ${fmtN(c.prev, d)}${unit} → `}jetzt <span class="text-slate-200 font-bold">${fmtN(c.cur, d)}${unit}</span></div>
          </div>
          <span class="shrink-0 px-2 py-1 rounded-lg border font-bold text-[11px] ${ui.bg} ${ui.cls}">${ui.e} ${deltaTxt}</span>
        </div>`;
    }

    function verdict(statuses) {
      const s = statuses.filter(x => x && x !== 'none');
      if (!s.length) return 'none';
      const real = s.filter(x => x !== 'first' && x !== 'mixed');
      if (!real.length) return s.includes('mixed') ? 'mixed' : 'first';
      const b = real.filter(x => x === 'better').length;
      const w = real.filter(x => x === 'worse').length;
      return b > w ? 'better' : (w > b ? 'worse' : 'same');
    }

    function verdictBadge(v, extra = '') {
      const ui = STATUS_UI[v] || STATUS_UI.none;
      return `<span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg border text-[11px] font-bold ${ui.bg} ${ui.cls}">${ui.e} ${extra || ui.word}</span>`;
    }

    function firstNote() {
      return `<p class="text-[11px] text-slate-400 italic bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2">Erster Eintrag – Vergleich ist ab dem nächsten Training möglich.</p>`;
    }

    function statTile(label, value, sub = '') {
      return `<div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80">
        <span class="text-[10px] text-slate-400 block">${label}</span>
        <span class="font-black text-white text-sm">${value}</span>
        ${sub ? `<span class="text-[10px] text-slate-500 block">${sub}</span>` : ''}
      </div>`;
    }

    // ---------- Daten-Struktur / Migration ----------
    function defaultRoutines() {
      return [
        { id: 'shower', name: 'Duschen', icon: 'shower-head', kind: 'weekly', target: 4 },
        { id: 'nails', name: 'Nägel schneiden', icon: 'scissors', kind: 'interval', days: 10 },
        { id: 'cream', name: 'Körpercreme', icon: 'droplets', kind: 'daily', slots: ['Morgens', 'Abends'] }
      ];
    }

    function ensurePerfData() {
      const u = currentUser;
      if (!u.perf) u.perf = {};
      const p = u.perf;
      if (!p.fitness) p.fitness = [];
      if (!p.football) p.football = [];
      if (!p.matches) p.matches = [];
      if (!p.social) p.social = { goalPerDay: 1, posts: [] };
      if (!p.social.posts) p.social.posts = [];
      if (!p.hygiene) p.hygiene = { routines: defaultRoutines(), logs: [] };
      if (!p.hygiene.logs) p.hygiene.logs = [];
      if (!p.photos) p.photos = [];
      if (!u.activeModules) u.activeModules = [];
      // Einmalig: die Performance-Module aktivieren (danach entscheidest du selbst im Modul-Manager)
      if (!u.perfSetupDone) {
        ['fitness', 'football', 'social_media', 'lifestyle', 'face_progress'].forEach(id => {
          if (!u.activeModules.includes(id)) u.activeModules.push(id);
        });
        u.perfSetupDone = true;
        saveUserData();
      }
    }

    // Entwürfe (z. B. halb eingetragene Schüsse) überleben Neuladen / App-Wechsel
    function draftKey(kind) { return `mylife_draft_${currentUser.username}_${kind}`; }
    function saveDraft(kind, obj) { try { localStorage.setItem(draftKey(kind), JSON.stringify(obj)); } catch (e) {} }
    function loadDraft(kind) { try { return JSON.parse(localStorage.getItem(draftKey(kind))); } catch (e) { return null; } }
    function clearDraft(kind) { localStorage.removeItem(draftKey(kind)); }

    // ---------- Modal ----------
    function openPerfModal(title, icon, bodyHTML) {
      document.getElementById('perf-modal-title').innerHTML = `<i data-lucide="${icon}" class="text-blue-400 w-5 h-5"></i> <span>${esc(title)}</span>`;
      const body = document.getElementById('perf-modal-body');
      body.innerHTML = bodyHTML;
      document.getElementById('modal-perf').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      body.scrollTop = 0;
      lucide.createIcons();
    }

    function setPerfBody(html, keepScroll = false) {
      const body = document.getElementById('perf-modal-body');
      const top = body.scrollTop;
      body.innerHTML = html;
      body.scrollTop = keepScroll ? top : 0;
      lucide.createIcons();
      if (typeof hydratePhotos === 'function') hydratePhotos(body);
    }

    function closePerfModal() {
      closeModal('modal-perf');
      document.body.style.overflow = '';
      renderDashboard();
    }

    // ---------- Dashboard-Überblick ----------
    function renderPerfOverview() {
      const el = document.getElementById('perf-overview');
      if (!el) return;
      const p = currentUser.perf;
      const act = currentUser.activeModules;
      const today = getTodayString();
      const tiles = [];

      const tile = (onclick, icon, title, main, sub) => `
        <button onclick="${onclick}" class="glass text-left rounded-2xl p-3 border border-slate-800 hover:border-blue-500 transition min-w-0">
          <div class="flex items-center gap-1.5 text-[11px] font-bold text-slate-400 mb-1"><i data-lucide="${icon}" class="w-3.5 h-3.5 text-blue-400"></i>${title}</div>
          <div class="text-sm font-black text-white truncate">${main}</div>
          <div class="text-[11px] text-slate-500 truncate">${sub}</div>
        </button>`;

      if (act.includes('fitness')) {
        const last = lastOf(p.fitness);
        if (last) {
          const a = fitAnalyze(last);
          tiles.push(tile('openFitnessHistory()', 'dumbbell', 'Fitness', `${last.duration} min ${FIT_TYPES[last.type] || ''}`,
            `${fmtDate(last.date)} | 🟢 ${a.counts.better} 🔴 ${a.counts.worse} 🟡 ${a.counts.same}`));
        } else tiles.push(tile('openFitnessForm()', 'dumbbell', 'Fitness', 'Kein Training', 'Erstes Training eintragen'));
      }
      if (act.includes('football')) {
        const last = lastOf(p.football);
        if (last) {
          const a = fbAnalyze(last);
          const em = ['dribbling', 'shots', 'passes', 'sprint'].map(k => (STATUS_UI[a[k].verdict] || STATUS_UI.none).e).join(' ');
          tiles.push(tile('openFootballHistory()', 'trophy', 'Fußball', `Training ${fmtDate(last.date)}`, `Dri Sch Pas Spd: ${em}`));
        } else tiles.push(tile('openFootballForm()', 'trophy', 'Fußball', 'Kein Training', 'Erste Einheit eintragen'));
      }
      if (act.includes('social_media')) {
        const posted = p.social.posts.some(x => x.date === today);
        const wk = p.social.posts.filter(x => daysBetween(x.date, today) >= 0 && daysBetween(x.date, today) < 7);
        const fol = wk.reduce((s, x) => s + (x.followers || 0), 0);
        tiles.push(tile('openSocialAnalysis()', 'share-2', 'Social Media', posted ? 'Heute gepostet ✅' : 'Noch nicht gepostet ❌', `7 Tage: ${fol >= 0 ? '+' : ''}${fmtN(fol, 0)} Follower`));
      }
      if (act.includes('lifestyle')) {
        const sh = p.hygiene.routines.find(r => r.kind === 'weekly');
        const main = sh ? `${sh.name} ${hygWeekCount(sh)}/${sh.target}` : 'Routinen';
        const daily = p.hygiene.routines.filter(r => r.kind === 'daily');
        const doneDaily = daily.filter(r => hygDailyDone(r, today) === 'full').length;
        tiles.push(tile('openHygieneHistory()', 'sparkles', 'Hygiene', main + (sh && hygWeekCount(sh) >= sh.target ? ' ✅' : ''), `Pflege heute: ${doneDaily}/${daily.length}`));
      }
      if (act.includes('face_progress')) {
        const last = lastOf(p.photos);
        tiles.push(tile('openFaceGallery()', 'scan-face', 'Aussehen', last ? `Foto vom ${fmtDate(last.date)}` : 'Noch kein Foto',
          last ? `vor ${daysBetween(last.date, today)} Tagen | ${p.photos.length} Fotos` : 'Erstes Foto hochladen'));
      }

      el.innerHTML = tiles.length ? `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">${tiles.join('')}</div>` : '';
    }

    // =====================================================================
    // ============================  FITNESS  ==============================
    // =====================================================================
    const FIT_TYPES = { upper: 'Oberkörper', lower: 'Unterkörper', full: 'Ganzkörper' };
    const FIT_MUSCLES = {
      upper: ['Brust', 'Rücken', 'Schultern', 'Bizeps', 'Trizeps', 'Bauch'],
      lower: ['Oberschenkel', 'Waden', 'Gesäß', 'Beine allgemein']
    };
    FIT_MUSCLES.full = FIT_MUSCLES.upper.concat(FIT_MUSCLES.lower);
    const FIT_EXERCISES = {
      'Brust': ['Liegestütze', 'Bankdrücken', 'Dips'],
      'Rücken': ['Pull-ups / Klimmzüge', 'Rudern', 'Superman'],
      'Schultern': ['Pike Push-ups', 'Schulterdrücken', 'Seitheben'],
      'Bizeps': ['Bizeps-Curls', 'Chin-ups', 'Hammer-Curls'],
      'Trizeps': ['Dips', 'Diamond Push-ups', 'Trizeps-Drücken'],
      'Bauch': ['Sit-ups', 'Plank', 'Crunches', 'Beinheben', 'Russian Twist'],
      'Oberschenkel': ['Squats', 'Lunges', 'Bulgarian Split Squats', 'Wall Sit'],
      'Waden': ['Wadenheben', 'Seilspringen'],
      'Gesäß': ['Hip Thrusts', 'Glute Bridge', 'Lunges'],
      'Beine allgemein': ['Squats', 'Jump Squats', 'Lunges', 'Step-ups']
    };
    const FIT_TIMED = ['plank', 'wall sit', 'seilspringen', 'seitstütz'];
    const FIT_MET = { light: 3.5, mid: 5.0, hard: 6.0 };
    const FIT_INTENSITY = { light: 'Locker', mid: 'Mittel', hard: 'Intensiv' };

    let fitDraft = null;

    function exNorm(n) { return String(n || '').trim().toLowerCase(); }

    function newFitDraft() {
      return { date: getTodayString(), type: 'upper', muscles: [], exercises: [], duration: '', intensity: 'mid' };
    }

    function fitKcal(duration, intensity) {
      const w = num(currentUser.profile && currentUser.profile.weight);
      const weight = w && w > 0 ? w : 70;
      const met = FIT_MET[intensity] || 5.0;
      const d = num(duration);
      if (!d || d <= 0) return null;
      return { kcal: Math.round(met * weight * (d / 60)), weight, assumed: !(w && w > 0), met };
    }

    function lastExerciseValues(name) {
      const key = exNorm(name);
      const sorted = sortChrono(currentUser.perf.fitness).reverse();
      for (const t of sorted) {
        const ex = t.exercises.find(e => exNorm(e.name) === key);
        if (ex) return ex;
      }
      return null;
    }

    function openFitnessForm() {
      fitDraft = loadDraft('fitness') || newFitDraft();
      openPerfModal('Training eintragen', 'dumbbell', '');
      renderFitForm();
    }

    function fitPersist() { saveDraft('fitness', fitDraft); }

    function renderFitForm() {
      const d = fitDraft;
      const muscles = FIT_MUSCLES[d.type];
      // Vorschläge: zuerst passend zu gewählten Muskeln, sonst zur Trainingsart
      const pool = (d.muscles.length ? d.muscles : muscles);
      const sugg = [];
      pool.forEach(m => (FIT_EXERCISES[m] || []).forEach(x => { if (!sugg.includes(x)) sugg.push(x); }));
      const used = [];
      sortChrono(currentUser.perf.fitness).reverse().forEach(t => t.exercises.forEach(e => {
        if (!used.some(u => exNorm(u) === exNorm(e.name))) used.push(e.name);
      }));
      const allNames = used.concat(Object.values(FIT_EXERCISES).flat()).filter((x, i, a) => a.findIndex(y => exNorm(y) === exNorm(x)) === i);
      const inDraft = d.exercises.map(e => exNorm(e.name));
      const kc = fitKcal(d.duration, d.intensity);

      const exRows = d.exercises.map((ex, i) => {
        const lastV = ex.name ? lastExerciseValues(ex.name) : null;
        const lastTxt = lastV ? (lastV.seconds !== null && lastV.seconds !== undefined
          ? `${lastV.sets} × ${fmtN(lastV.seconds, 0)} s` : `${lastV.sets} × ${lastV.reps}${lastV.weight ? ` @ ${fmtN(lastV.weight, 1)} kg` : ''}`) : '';
        return `
        <div class="bg-slate-950/70 border border-slate-800 rounded-2xl p-3 space-y-2">
          <div class="flex gap-2 items-center">
            <input list="fit-ex-list" value="${esc(ex.name)}" placeholder="Übungsname" oninput="fitEx(${i},'name',this.value)" onchange="fitExNameChosen(${i})" class="${INP} font-semibold">
            <button onclick="fitRemoveEx(${i})" class="p-2 text-slate-500 hover:text-rose-400" aria-label="Übung entfernen"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div class="flex gap-1.5">
            <button onclick="fitSetTimed(${i},false)" class="${chipCls(!ex.timed)} !py-1">Wiederholungen</button>
            <button onclick="fitSetTimed(${i},true)" class="${chipCls(ex.timed)} !py-1">Zeit</button>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div><label class="${LBL}">Sätze</label><input inputmode="numeric" value="${esc(ex.sets)}" oninput="fitEx(${i},'sets',this.value)" class="${INP}"></div>
            ${ex.timed
              ? `<div><label class="${LBL}">Sek. / Satz</label><input inputmode="decimal" value="${esc(ex.seconds)}" oninput="fitEx(${i},'seconds',this.value)" class="${INP}"></div>`
              : `<div><label class="${LBL}">Wdh. / Satz</label><input inputmode="numeric" value="${esc(ex.reps)}" oninput="fitEx(${i},'reps',this.value)" class="${INP}"></div>`}
            <div><label class="${LBL}">Gewicht kg</label><input inputmode="decimal" value="${esc(ex.weight)}" placeholder="optional" oninput="fitEx(${i},'weight',this.value)" class="${INP}"></div>
          </div>
          ${lastTxt ? `<p class="text-[11px] text-slate-500">Letztes Mal: <span class="text-slate-300">${esc(lastTxt)}</span></p>` : ''}
        </div>`;
      }).join('');

      setPerfBody(`
        <div class="space-y-4">
          <datalist id="fit-ex-list">${allNames.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist>

          <div class="${BOX}">
            <div class="grid grid-cols-2 gap-2">
              <div><label class="${LBL}">Datum</label><input type="date" value="${d.date}" onchange="fitDraft.date=this.value;fitPersist()" class="${INP}"></div>
              <div><label class="${LBL}">Trainingszeit (min)</label><input inputmode="numeric" value="${esc(d.duration)}" placeholder="z. B. 60" oninput="fitDraft.duration=this.value;fitPersist();fitUpdateKcal()" class="${INP}"></div>
            </div>
            <div>
              <label class="${LBL}">Trainingsart</label>
              <div class="flex flex-wrap gap-1.5">
                ${Object.keys(FIT_TYPES).map(t => `<button onclick="fitSetType('${t}')" class="${chipCls(d.type === t)}">${FIT_TYPES[t]}</button>`).join('')}
              </div>
            </div>
            <div>
              <label class="${LBL}">Muskelbereiche</label>
              <div class="flex flex-wrap gap-1.5">
                ${muscles.map(m => `<button onclick="fitToggleMuscle('${m}')" class="${chipCls(d.muscles.includes(m), 'emerald')}">${m}</button>`).join('')}
              </div>
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-slate-300">Übungen (${d.exercises.length})</span>
            </div>
            ${exRows || `<p class="text-xs text-slate-500 italic">Noch keine Übung. Tippe unten auf einen Vorschlag oder auf „+ Übung hinzufügen“.</p>`}
            <div class="flex flex-wrap gap-1.5">
              ${(window._fitSugg = sugg.filter(s => !inDraft.includes(exNorm(s))).slice(0, 10)).map((s, si) => `<button onclick="fitQuickAdd(window._fitSugg[${si}])" class="px-2.5 py-1.5 rounded-xl border border-dashed border-slate-600 text-[11px] text-slate-300 hover:border-blue-500">+ ${esc(s)}</button>`).join('')}
            </div>
            <button onclick="fitAddEx()" class="w-full py-2.5 border border-blue-500/40 bg-blue-600/10 text-blue-300 rounded-xl text-sm font-bold hover:bg-blue-600/20 transition">+ Übung hinzufügen</button>
          </div>

          <div class="${BOX}">
            <label class="${LBL}">Intensität (für Kalorien-Schätzung)</label>
            <div class="flex gap-1.5">
              ${Object.keys(FIT_INTENSITY).map(k => `<button onclick="fitDraft.intensity='${k}';fitPersist();renderFitForm()" class="${chipCls(d.intensity === k)}">${FIT_INTENSITY[k]}</button>`).join('')}
            </div>
            <div id="fit-kcal">${fitKcalHTML(kc)}</div>
          </div>

          <div class="flex gap-2 pb-2">
            <button onclick="fitSave()" class="${BTN_PRIMARY} flex-1">Training speichern</button>
            <button onclick="fitDiscard()" class="px-4 py-3 bg-rose-600/20 text-rose-400 border border-rose-500/30 rounded-xl font-bold text-sm">Verwerfen</button>
          </div>
        </div>`, true);
    }

    function fitKcalHTML(kc) {
      if (!kc) return `<p class="text-[11px] text-slate-500">Trag die Trainingszeit ein, dann wird der Verbrauch geschätzt.</p>`;
      return `<p class="text-sm text-white font-bold">≈ ${kc.kcal} kcal <span class="text-[11px] font-normal text-amber-300">(Schätzung)</span></p>
        <p class="text-[11px] text-slate-500">Berechnet mit MET ${fmtN(kc.met, 1)} × ${fmtN(kc.weight, 1)} kg × Trainingszeit.
        ${kc.assumed ? '<span class="text-amber-300">Kein Gewicht im Steckbrief – 70 kg angenommen.</span>' : ''} Ohne Puls- oder Geräte-Daten ist das nur ein Richtwert.</p>`;
    }
    function fitUpdateKcal() { const el = document.getElementById('fit-kcal'); if (el) el.innerHTML = fitKcalHTML(fitKcal(fitDraft.duration, fitDraft.intensity)); }

    function fitSetType(t) { fitDraft.type = t; fitDraft.muscles = fitDraft.muscles.filter(m => FIT_MUSCLES[t].includes(m)); fitPersist(); renderFitForm(); }
    function fitToggleMuscle(m) { const a = fitDraft.muscles; const i = a.indexOf(m); if (i >= 0) a.splice(i, 1); else a.push(m); fitPersist(); renderFitForm(); }
    function fitEx(i, key, val) { fitDraft.exercises[i][key] = val; fitPersist(); }
    function fitSetTimed(i, t) { fitDraft.exercises[i].timed = t; fitPersist(); renderFitForm(); }
    function fitRemoveEx(i) { fitDraft.exercises.splice(i, 1); fitPersist(); renderFitForm(); }
    function fitAddEx() { fitDraft.exercises.push({ name: '', timed: false, sets: '3', reps: '', weight: '', seconds: '' }); fitPersist(); renderFitForm(); }

    function fitPrefill(ex) {
      const lastV = lastExerciseValues(ex.name);
      if (lastV) {
        ex.timed = lastV.seconds !== null && lastV.seconds !== undefined;
        ex.sets = String(lastV.sets || 3);
        ex.reps = lastV.reps !== null && lastV.reps !== undefined ? String(lastV.reps) : '';
        ex.seconds = ex.timed ? String(lastV.seconds) : '';
        ex.weight = lastV.weight ? String(lastV.weight) : '';
      } else if (FIT_TIMED.some(t => exNorm(ex.name).includes(t))) {
        ex.timed = true; if (!ex.seconds) ex.seconds = '30';
      }
    }
    function fitQuickAdd(name) {
      const ex = { name, timed: false, sets: '3', reps: '', weight: '', seconds: '' };
      fitPrefill(ex);
      fitDraft.exercises.push(ex); fitPersist(); renderFitForm();
    }
    function fitExNameChosen(i) {
      const ex = fitDraft.exercises[i];
      if (ex.name && !ex.reps && !ex.seconds) { fitPrefill(ex); fitPersist(); renderFitForm(); }
    }
    function fitDiscard() {
      if (!confirm('Eingaben verwerfen?')) return;
      clearDraft('fitness'); fitDraft = newFitDraft(); renderFitForm();
    }

    function fitSave() {
      const d = fitDraft;
      const duration = num(d.duration);
      if (!duration || duration <= 0) return alert('Bitte die Trainingszeit in Minuten eintragen.');
      const exercises = [];
      for (const ex of d.exercises) {
        if (!ex.name.trim()) continue;
        const sets = num(ex.sets);
        const reps = ex.timed ? null : num(ex.reps);
        const seconds = ex.timed ? num(ex.seconds) : null;
        if (!sets || sets <= 0) return alert(`„${ex.name}“: Bitte Anzahl Sätze eintragen.`);
        if (!ex.timed && (reps === null || reps < 0)) return alert(`„${ex.name}“: Bitte Wiederholungen pro Satz eintragen.`);
        if (ex.timed && (!seconds || seconds <= 0)) return alert(`„${ex.name}“: Bitte Sekunden pro Satz eintragen.`);
        const w = num(ex.weight);
        exercises.push({ name: ex.name.trim(), sets, reps, seconds, weight: w && w > 0 ? w : null });
      }
      if (!exercises.length) return alert('Bitte mindestens eine Übung mit Namen eintragen.');
      const kc = fitKcal(duration, d.intensity);
      const entry = {
        id: uid(), createdAt: Date.now(), date: d.date || getTodayString(), type: d.type, muscles: d.muscles.slice(),
        exercises, duration, intensity: d.intensity, kcal: kc ? kc.kcal : null,
        kcalBasis: kc ? { weight: kc.weight, assumed: kc.assumed, met: kc.met } : null
      };
      currentUser.perf.fitness.push(entry);
      saveUserData();
      clearDraft('fitness');
      fitDraft = newFitDraft();
      showFitnessAnalysis(entry.id, true);
    }

    // ----- Fitness-Analyse -----
    function exPrimary(ex) {
      const sets = ex.sets || 1;
      if (ex.seconds !== null && ex.seconds !== undefined) return { timed: true, total: sets * ex.seconds };
      const reps = ex.reps || 0;
      return { timed: false, totalReps: sets * reps, volume: ex.weight ? sets * reps * ex.weight : null };
    }

    function exCompare(cur, prev) {
      if (!prev) return { status: 'first', rows: [] };
      const pc = exPrimary(cur), pp = exPrimary(prev);
      const rows = [];
      if (pc.timed !== pp.timed) return { status: 'mixed', rows, note: 'Einmal mit Zeit, einmal mit Wiederholungen eingetragen – nicht direkt vergleichbar.' };
      const wc = cur.weight || 0, wp = prev.weight || 0;
      if (wc || wp) rows.push(['Gewicht', cmpVal(wc, wp), { unit: ' kg', d: 1 }]);
      rows.push(['Sätze', cmpVal(cur.sets, prev.sets), { d: 0 }]);
      let primary, note = '';
      if (pc.timed) {
        rows.push(['Zeit pro Satz', cmpVal(cur.seconds, prev.seconds), { unit: ' s', d: 0 }]);
        primary = cmpVal(pc.total, pp.total);
        rows.push(['Gesamtzeit', primary, { unit: ' s', d: 0, pct: true }]);
      } else {
        rows.push(['Wdh. pro Satz', cmpVal(cur.reps, prev.reps), { d: 0 }]);
        const tr = cmpVal(pc.totalReps, pp.totalReps);
        rows.push(['Wiederholungen gesamt', tr, { d: 0, pct: true }]);
        if (wc === wp) primary = tr;
        else if (wc > 0 && wp > 0) {
          primary = cmpVal(pc.volume, pp.volume);
          rows.push(['Volumen (Sätze × Wdh. × kg)', primary, { unit: ' kg', d: 0, pct: true }]);
          note = 'Gewicht geändert – bewertet über das Trainingsvolumen.';
        } else if (wc > wp && pc.totalReps >= pp.totalReps) {
          primary = { status: 'better' }; note = 'Zusatzgewicht bei gleich vielen oder mehr Wiederholungen.';
        } else if (wc < wp && pc.totalReps <= pp.totalReps) {
          primary = { status: 'worse' }; note = 'Ohne Zusatzgewicht und nicht mehr Wiederholungen.';
        } else {
          primary = { status: 'mixed' }; note = 'Gewicht geändert (mit/ohne Zusatzgewicht) – nur bedingt vergleichbar.';
        }
      }
      return { status: primary.status, rows, note, primaryVal: pc.timed ? pc.total : pc.totalReps };
    }

    function fitAnalyze(entry) {
      const all = currentUser.perf.fitness;
      const prevSame = previousOf(all, entry, e => e.type === entry.type);
      const prevSession = prevSame || previousOf(all, entry);
      const sessionRows = [];
      if (prevSession) {
        const totReps = t => t.exercises.reduce((s, e) => s + (e.reps ? e.reps * e.sets : 0), 0);
        const totSets = t => t.exercises.reduce((s, e) => s + (e.sets || 0), 0);
        sessionRows.push(['Trainingszeit', cmpVal(entry.duration, prevSession.duration), { unit: ' min', d: 0, pct: true }]);
        sessionRows.push(['Sätze gesamt', cmpVal(totSets(entry), totSets(prevSession)), { d: 0 }]);
        sessionRows.push(['Wiederholungen gesamt', cmpVal(totReps(entry), totReps(prevSession)), { d: 0, pct: true }]);
      }
      const exResults = entry.exercises.map(ex => {
        const key = exNorm(ex.name);
        const prevT = previousOf(all, entry, t => t.exercises.some(e => exNorm(e.name) === key));
        const prevEx = prevT ? prevT.exercises.find(e => exNorm(e.name) === key) : null;
        const res = exCompare(ex, prevEx);
        res.name = ex.name; res.ex = ex; res.prevDate = prevT ? prevT.date : null;
        // Stagnation: wie oft hintereinander gleicher Hauptwert?
        if (res.status === 'same') {
          let streak = 1, cursor = prevT, val = res.primaryVal;
          while (cursor) {
            const pe = cursor.exercises.find(e => exNorm(e.name) === key);
            const pv = exPrimary(pe);
            if ((pv.timed ? pv.total : pv.totalReps) !== val) break;
            streak++;
            cursor = previousOf(all, cursor, t => t.exercises.some(e => exNorm(e.name) === key));
          }
          res.streak = streak;
        }
        return res;
      });
      const counts = { better: 0, worse: 0, same: 0, first: 0, mixed: 0 };
      exResults.forEach(r => counts[r.status]++);
      return { prevSession, sameType: !!prevSame, sessionRows, exResults, counts };
    }

    function showFitnessAnalysis(id, justSaved = false) {
      const entry = currentUser.perf.fitness.find(e => e.id === id);
      if (!entry) return;
      const a = fitAnalyze(entry);
      const c = a.counts;
      let motivation;
      if (!a.prevSession) motivation = 'Erstes Training gespeichert. Ab dem nächsten Training siehst du hier deinen Fortschritt.';
      else if (c.better > 0 && c.worse === 0) motivation = `Stark! ${c.better} ${c.better === 1 ? 'Übung' : 'Übungen'} verbessert und nichts verschlechtert.`;
      else if (c.better >= c.worse && c.better > 0) motivation = `Gute Einheit: ${c.better} besser, ${c.worse} schlechter. Bleib dran.`;
      else if (c.worse > c.better) motivation = 'Heute lief weniger – passiert. Achte auf Schlaf, Essen und Pausen und hol es dir beim nächsten Mal zurück.';
      else motivation = 'Konstant geblieben. Versuch beim nächsten Mal bei einer Übung 1–2 Wiederholungen mehr.';

      const names = st => a.exResults.filter(r => r.status === st).map(r => esc(r.name)).join(', ');

      const exBlocks = a.exResults.map(r => {
        const ex = r.ex;
        const val = ex.seconds !== null && ex.seconds !== undefined ? `${ex.sets} × ${fmtN(ex.seconds, 0)} s` : `${ex.sets} × ${ex.reps}${ex.weight ? ` @ ${fmtN(ex.weight, 1)} kg` : ''}`;
        let extra = '';
        if (r.status === 'same' && r.streak >= 2) extra = `Stagniert (${r.streak}× gleich)`;
        return `
          <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-3 space-y-2">
            <div class="flex items-center justify-between gap-2">
              <div class="min-w-0"><div class="font-bold text-white text-sm truncate">${esc(r.name)}</div><div class="text-[11px] text-slate-500">${val}${r.prevDate ? ` | Vergleich mit ${fmtDate(r.prevDate)}` : ''}</div></div>
              ${verdictBadge(r.status, extra)}
            </div>
            ${r.status === 'first' ? '<p class="text-[11px] text-slate-500 italic">Erstes Mal eingetragen – Vergleich ab dem nächsten Mal.</p>' : ''}
            ${r.rows.map(x => cmpRow(x[0], x[1], x[2])).join('')}
            ${r.note ? `<p class="text-[11px] text-amber-300/80">${r.note}</p>` : ''}
          </div>`;
      }).join('');

      openPerfModal(justSaved ? 'Training gespeichert' : 'Fitness-Analyse', 'bar-chart-3', `
        <div class="space-y-4">
          <div class="bg-blue-600/10 border border-blue-500/30 rounded-2xl p-3 text-sm text-blue-100">${motivation}</div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            ${statTile('Datum', fmtDate(entry.date), FIT_TYPES[entry.type])}
            ${statTile('Trainingszeit', entry.duration + ' min')}
            ${statTile('Übungen', entry.exercises.length, entry.muscles.join(', ') || '')}
            ${statTile('Kalorien', entry.kcal ? '≈ ' + entry.kcal + ' kcal' : '–', 'Schätzung')}
          </div>

          ${a.prevSession ? `
            <div class="space-y-2">
              <span class="text-xs font-bold text-slate-300">Ganze Einheit vs. ${fmtDate(a.prevSession.date)} ${a.sameType ? `(${FIT_TYPES[entry.type]})` : '(letztes Training)'}</span>
              ${a.sessionRows.map(x => cmpRow(x[0], x[1], x[2])).join('')}
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
              <div class="${STATUS_UI.better.bg} border rounded-xl p-2.5"><b class="text-emerald-400">🟢 Verbessert</b><div class="text-slate-300 mt-1">${names('better') || '–'}</div></div>
              <div class="${STATUS_UI.worse.bg} border rounded-xl p-2.5"><b class="text-rose-400">🔴 Schlechter</b><div class="text-slate-300 mt-1">${names('worse') || '–'}</div></div>
              <div class="${STATUS_UI.same.bg} border rounded-xl p-2.5"><b class="text-amber-300">🟡 Stagniert</b><div class="text-slate-300 mt-1">${names('same') || '–'}</div></div>
            </div>` : firstNote()}

          <div class="space-y-2">
            <span class="text-xs font-bold text-slate-300">Übungen im Detail</span>
            ${exBlocks}
          </div>
          <div class="grid grid-cols-2 gap-2 pb-2">
            <button onclick="openFitnessForm()" class="${BTN_GHOST}">Neues Training</button>
            <button onclick="openFitnessHistory()" class="${BTN_GHOST}">Verlauf</button>
          </div>
        </div>`);
    }

    function openFitnessHistory() {
      const list = sortChrono(currentUser.perf.fitness).reverse();
      const html = list.length ? list.map(t => {
        const a = fitAnalyze(t);
        return `
        <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-3 space-y-1.5">
          <div class="flex justify-between items-start gap-2">
            <div>
              <div class="font-bold text-white text-sm">${fmtDate(t.date)} | ${FIT_TYPES[t.type]}</div>
              <div class="text-[11px] text-slate-400">${t.duration} min | ${t.kcal ? '≈ ' + t.kcal + ' kcal' : ''} | 🟢 ${a.counts.better} 🔴 ${a.counts.worse} 🟡 ${a.counts.same}</div>

            <button onclick="fitDelete('${t.id}')" class="text-slate-600 hover:text-rose-400 p-1" aria-label="Löschen"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
