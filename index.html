              ${SPRINT_DISTS.map(dist => `
                <div class="grid grid-cols-[3rem_1fr_1fr_3.5rem] gap-2 items-center">
                  <span class="text-sm font-bold text-white">${dist} m</span>
                  ${fbIn(`sprint.${d.sprint.variant}.${dist}.0`, d.sprint[d.sprint.variant][dist][0], { ph: 's' })}
                  ${fbIn(`sprint.${d.sprint.variant}.${dist}.1`, d.sprint[d.sprint.variant][dist][1], { ph: 's' })}
                  <span id="fb-sprint-best-${dist}" class="text-sm font-black text-emerald-400 text-right">–</span>
                </div>`).join('')}
            </div>
          </div>` : ''}

          <div class="${BOX}">
            <label class="${LBL}">Notizen (optional)</label>
            <textarea rows="2" oninput="fbSet('notes', this.value)" class="${INP}" placeholder="Wie hast du dich gefühlt? Was willst du verbessern?">${esc(d.notes)}</textarea>
          </div>

          <div class="flex gap-2 pb-2">
            <button onclick="fbSaveTraining()" class="${BTN_PRIMARY} flex-1">Training speichern</button>
            <button onclick="fbDiscard()" class="px-4 py-3 bg-rose-600/20 text-rose-400 border border-rose-500/30 rounded-xl font-bold text-sm">Verwerfen</button>
          </div>
        </div>`, true);
      fbLive();
    }

    function renderShotInput() {
      const s = fbDraft.shots;
      const series = s.data[s.type][s.foot];
      const full = series.length >= SHOTS_PER_SERIES;
      const cnt = z => series.filter(x => x === z).length;
      const summary = (type, foot) => {
        const arr = s.data[type][foot];
        const g = arr.filter(x => GOAL_ZONES.includes(x)).length;
        return arr.length ? `${g}/${arr.length}` : '0/16';
      };
      const chipColor = z => GOAL_ZONES.includes(z) ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
        : (z === 'saved' ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-rose-500/20 text-rose-300 border-rose-500/40');
      const label = z => z === 'miss' ? '✕' : (z === 'saved' ? 'G' : ZONES.find(x => x[0] === z)[2]);

      return `
        <div class="${BOX}">
          <h4 class="font-bold text-white text-sm flex items-center gap-2"><i data-lucide="target" class="w-4 h-4 text-blue-400"></i> Schuss-Training</h4>
          <div class="flex flex-wrap gap-1.5">
            ${SHOT_TYPES.map(t => `<button onclick="fbShotSel('type','${t.id}')" class="${chipCls(s.type === t.id)}">${t.name}
              <span class="opacity-70 ml-1">R ${summary(t.id, 'R')} | L ${summary(t.id, 'L')}</span></button>`).join('')}
          </div>
          <div class="flex gap-1.5">
            ${['R', 'L'].map(f => `<button onclick="fbShotSel('foot','${f}')" class="${chipCls(s.foot === f, 'emerald')} flex-1">${FOOT[f]}</button>`).join('')}
          </div>
          <div class="flex items-center justify-between text-xs">
            <span class="text-slate-300">Schuss <b class="text-white">${Math.min(series.length + 1, SHOTS_PER_SERIES)}</b> von ${SHOTS_PER_SERIES} – tippe, wohin der Ball ging</span>
            <span class="font-bold ${full ? 'text-emerald-400' : 'text-slate-400'}">${series.length}/${SHOTS_PER_SERIES}${full ? ' ✓' : ''}</span>
          </div>
          <div class="rounded-t-xl border-4 border-b-0 border-slate-200/80 p-1.5 bg-[repeating-linear-gradient(45deg,rgba(255,255,255,0.03)_0_6px,transparent_6px_12px)]">
            <div class="grid grid-cols-3 gap-1.5">
              ${ZONES.map(z => `<button ${full ? 'disabled' : ''} onclick="fbShot('${z[0]}')" class="h-14 rounded-lg bg-emerald-600/15 border border-emerald-500/30 text-emerald-200 text-[11px] font-semibold active:scale-95 transition disabled:opacity-40 flex flex-col items-center justify-center">
                ${z[1]}${cnt(z[0]) ? `<span class="text-[10px] text-emerald-400 font-black">${cnt(z[0])}×</span>` : ''}</button>`).join('')}
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button ${full ? 'disabled' : ''} onclick="fbShot('miss')" class="py-3 rounded-xl bg-rose-600/15 border border-rose-500/30 text-rose-300 text-sm font-bold active:scale-95 disabled:opacity-40">Daneben ${cnt('miss') ? `(${cnt('miss')})` : ''}</button>
            <button ${full ? 'disabled' : ''} onclick="fbShot('saved')" class="py-3 rounded-xl bg-amber-600/15 border border-amber-500/30 text-amber-300 text-sm font-bold active:scale-95 disabled:opacity-40">Gehalten ${cnt('saved') ? `(${cnt('saved')})` : ''}</button>
          </div>
          ${series.length ? `
            <div class="flex flex-wrap gap-1">${series.map((z, i) => `<span class="px-1.5 py-0.5 rounded-md border text-[10px] font-bold ${chipColor(z)}">${i + 1}:${label(z)}</span>`).join('')}</div>
            <div class="flex items-center justify-between">
              <span class="text-xs text-slate-300">Treffer: <b class="text-white">${series.filter(x => GOAL_ZONES.includes(x)).length}/${series.length}</b> (${fmtN(rate(series.filter(x => GOAL_ZONES.includes(x)).length, series.length), 2)} %)</span>
              <button onclick="fbShotUndo()" class="${BTN_GHOST}">↶ Letzten Schuss löschen</button>
            </div>` : ''}
        </div>`;
    }

    function fbShotSel(key, val) { fbDraft.shots[key] = val; fbPersist(); renderFbForm(); }
    function fbShot(zone) {
      const s = fbDraft.shots;
      const arr = s.data[s.type][s.foot];
      if (arr.length >= SHOTS_PER_SERIES) return;
      arr.push(zone);
      // Serie voll → automatisch zum anderen Fuß wechseln, falls der noch leer ist
      if (arr.length === SHOTS_PER_SERIES) {
        const other = s.foot === 'R' ? 'L' : 'R';
        if (s.data[s.type][other].length < SHOTS_PER_SERIES) s.foot = other;
      }
      fbPersist(); renderFbForm();
    }
    function fbShotUndo() { const s = fbDraft.shots; s.data[s.type][s.foot].pop(); fbPersist(); renderFbForm(); }

    function fbLive() {
      const d = fbDraft;
      const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
      if (d.mode !== 'training') return;
      const a = num(d.dribbling.attempts), s = num(d.dribbling.success);
      set('fb-drib-err', a !== null && s !== null ? Math.max(0, a - s) : '–');
      const times = d.dribbling.times.map(num).filter(x => x !== null && x > 0);
      set('fb-drib-live', [
        a && s !== null ? `Erfolgsquote <b class="text-white">${fmtN(rate(s, a), 1)} %</b>` : '',
        times.length ? `Beste Zeit <b class="text-white">${fmtN(Math.min(...times), 2)} s</b> | Ø <b class="text-white">${fmtN(mean(times), 2)} s</b>` : ''
      ].filter(Boolean).join(' | '));
      const pl = d.passes.long;
      const la = num(pl.attempts), ls = num(pl.success);
      set('fb-pass-long-live', la && ls !== null ? `Erfolgsquote <b class="text-white">${fmtN(rate(ls, la), 1)} %</b> | Fehlpässe ${Math.max(0, la - ls)}` : '');
      ['short', 'curved'].forEach(k => {
        const pa = num(d.passes[k].attempts), ps = num(d.passes[k].success);
        set(`fb-pass-${k}-err`, pa !== null && ps !== null ? Math.max(0, pa - ps) : '–');
        set(`fb-pass-${k}-live`, pa && ps !== null ? `Erfolgsquote <b class="text-white">${fmtN(rate(ps, pa), 1)} %</b>` : '');
      });
      SPRINT_DISTS.forEach(dist => {
        const v = d.sprint[d.sprint.variant][dist].map(num).filter(x => x !== null && x > 0);
        set(`fb-sprint-best-${dist}`, v.length ? fmtN(Math.min(...v), 2) + ' s' : '–');
      });
    }

    function fbDiscard() {
      if (!confirm('Alle Eingaben dieser Einheit verwerfen?')) return;
      clearDraft('football'); const mode = fbDraft.mode; fbDraft = newFbDraft(); fbDraft.mode = mode; renderFbForm();
    }

    function fbSaveTraining() {
      const d = fbDraft;
      const entry = { id: uid(), createdAt: Date.now(), date: d.date || getTodayString(), kind: 'training', notes: d.notes.trim() };
      const errors = [];

      if (d.sections.dribbling) {
        const attempts = num(d.dribbling.attempts), success = num(d.dribbling.success);
        const times = d.dribbling.times.map(num).filter(x => x !== null && x > 0);
        if (attempts && success !== null) {
          if (success > attempts) errors.push('Dribbling: mehr Erfolge als Versuche.');
          entry.dribbling = { parcours: (d.dribbling.parcours || 'Standard').trim() || 'Standard', attempts, success, times };
        } else if (times.length) {
          entry.dribbling = { parcours: (d.dribbling.parcours || 'Standard').trim() || 'Standard', attempts: null, success: null, times };
        }
      }
      if (d.sections.shots) {
        const shots = {};
        SHOT_TYPES.forEach(t => {
          ['R', 'L'].forEach(f => {
            const arr = d.shots.data[t.id][f];
            if (arr.length) { shots[t.id] = shots[t.id] || {}; shots[t.id][f] = arr.slice(); }
          });
        });
        if (Object.keys(shots).length) entry.shots = shots;
      }
      if (d.sections.passes) {
        const passes = {};
        Object.keys(PASS_TYPES).forEach(k => {
          const p = d.passes[k];
          const attempts = num(p.attempts), success = num(p.success);
          if (attempts && success !== null) {
            if (success > attempts) errors.push(`${PASS_TYPES[k]}: mehr Erfolge als Versuche.`);
            passes[k] = { attempts, success };
            if (k === 'long') {
              passes[k].target = num(p.target);
              const dists = String(p.dists || '').split(/[\s;]+/).map(num).filter(x => x !== null && x > 0);
              passes[k].dists = dists;
              const mx = num(p.max);
              passes[k].max = mx !== null ? mx : (dists.length ? Math.max(...dists) : null);
            }
          }
        });
        if (Object.keys(passes).length) entry.passes = passes;
      }
      if (d.sections.sprint) {
        const sprint = {};
        Object.keys(SPRINT_VAR).forEach(v => {
          SPRINT_DISTS.forEach(dist => {
            const tries = d.sprint[v][dist].map(num).filter(x => x !== null && x > 0);
            if (tries.length) { sprint[v] = sprint[v] || {}; sprint[v][dist] = { tries, best: Math.min(...tries) }; }
          });
        });
        if (Object.keys(sprint).length) entry.sprint = sprint;
      }
      if (errors.length) return alert(errors.join('\n'));
      if (!entry.dribbling && !entry.shots && !entry.passes && !entry.sprint) {
        return alert('Bitte wähle oben mindestens einen Bereich und trag Werte ein.');
      }
      currentUser.perf.football.push(entry);
      saveUserData();
      clearDraft('football');
      fbDraft = newFbDraft();
      showFootballAnalysis(entry.id, true);
    }

    // ----- Fußball-Analyse -----
    function shotStats(arr) {
      const goals = arr.filter(x => GOAL_ZONES.includes(x)).length;
      return { n: arr.length, goals, saved: arr.filter(x => x === 'saved').length, miss: arr.filter(x => x === 'miss').length, rate: rate(goals, arr.length) };
    }

    function fbAnalyze(entry) {
      const all = currentUser.perf.football;
      const out = {};

      // Dribbling – nur mit gleichem Parcours vergleichen
      if (entry.dribbling) {
        const dr = entry.dribbling;
        const prev = previousOf(all, entry, e => e.dribbling && e.dribbling.parcours.toLowerCase() === dr.parcours.toLowerCase());
        const pd = prev ? prev.dribbling : null;
        const cur = { rate: dr.attempts ? rate(dr.success, dr.attempts) : null, best: dr.times.length ? Math.min(...dr.times) : null, avg: dr.times.length ? mean(dr.times) : null };
        const old = pd ? { rate: pd.attempts ? rate(pd.success, pd.attempts) : null, best: pd.times.length ? Math.min(...pd.times) : null, avg: pd.times.length ? mean(pd.times) : null } : {};
        const rows = [
          ['Erfolgsquote', cmpVal(cur.rate, old.rate), { unit: ' %', d: 1, deltaUnit: ' %-Pkt.' }],
          ['Beste Zeit', cmpVal(cur.best, old.best, false), { unit: ' s', time: true }],
          ['Durchschnittszeit', cmpVal(cur.avg, old.avg, false), { unit: ' s', time: true }]
        ];
        out.dribbling = { prev, cur, rows, verdict: prev ? verdict(rows.map(r => r[1].status)) : 'first' };
      } else out.dribbling = { verdict: 'none' };

      // Schüsse – pro Schussart und Fuß mit der letzten gleichen Serie vergleichen
      if (entry.shots) {
        const blocks = [];
        const statuses = [];
        SHOT_TYPES.forEach(t => {
          if (!entry.shots[t.id]) return;
          const feet = {};
          ['R', 'L'].forEach(f => {
            const arr = entry.shots[t.id][f];
            if (!arr) return;
            const st = shotStats(arr);
            const prev = previousOf(all, entry, e => e.shots && e.shots[t.id] && e.shots[t.id][f]);
            const pst = prev ? shotStats(prev.shots[t.id][f]) : null;
            const c = cmpVal(st.rate, pst ? pst.rate : null);
            statuses.push(c.status);
            feet[f] = { st, prev, c, arr };
          });
          blocks.push({ type: t, feet });
        });
        out.shots = { blocks, verdict: verdict(statuses) };
      } else out.shots = { verdict: 'none' };

      // Pässe – pro Pass-Art
      if (entry.passes) {
        const rows = [];
        Object.keys(PASS_TYPES).forEach(k => {
          const p = entry.passes[k];
          if (!p) return;
          const prev = previousOf(all, entry, e => e.passes && e.passes[k]);
          const pp = prev ? prev.passes[k] : null;
          rows.push([`${PASS_TYPES[k]} – Quote`, cmpVal(rate(p.success, p.attempts), pp ? rate(pp.success, pp.attempts) : null), { unit: ' %', d: 1, deltaUnit: ' %-Pkt.' }]);
          if (k === 'long' && p.max !== null && p.max !== undefined) {
            rows.push(['Weitester langer Pass', cmpVal(p.max, pp && pp.max !== null && pp.max !== undefined ? pp.max : null), { unit: ' m', d: 1 }]);
          }
        });
        out.passes = { rows, verdict: verdict(rows.map(r => r[1].status)) };
      } else out.passes = { verdict: 'none' };

      // Sprint – pro Distanz und Variante (ohne/mit Ball getrennt)
      if (entry.sprint) {
        const groups = [];
        const statuses = [];
        Object.keys(SPRINT_VAR).forEach(v => {
          if (!entry.sprint[v]) return;
          const rows = [];
          SPRINT_DISTS.forEach(dist => {
            const cur = entry.sprint[v][dist];
            if (!cur) return;
            const prev = previousOf(all, entry, e => e.sprint && e.sprint[v] && e.sprint[v][dist]);
            const c = cmpVal(cur.best, prev ? prev.sprint[v][dist].best : null, false);
            statuses.push(c.status);
            rows.push({ dist, cur, c, kmh: (dist / cur.best) * 3.6 });
          });
          groups.push({ v, rows });
        });
        out.sprint = { groups, verdict: verdict(statuses) };
      } else out.sprint = { verdict: 'none' };

      return out;
    }

    function zoneHeat(arr) {
      const max = Math.max(1, ...ZONES.map(z => arr.filter(x => x === z[0]).length));
      return `<div class="grid grid-cols-3 gap-0.5 w-24 border-2 border-b-0 border-slate-300/70 p-0.5 rounded-t-md">
        ${ZONES.map(z => { const n = arr.filter(x => x === z[0]).length; return `<div class="h-5 rounded-sm text-[9px] font-bold flex items-center justify-center ${n ? 'text-white' : 'text-slate-600'}" style="background: rgba(16,185,129,${n ? 0.15 + 0.7 * n / max : 0.05})" title="${z[1]}">${n || ''}</div>`; }).join('')}
      </div>`;
    }

    function showFootballAnalysis(id, justSaved = false) {
      const entry = currentUser.perf.football.find(e => e.id === id);
      if (!entry) return;
      const a = fbAnalyze(entry);

      const overview = Object.keys(FB_SECTIONS).map(k => {
        const v = a[k].verdict;
        const ui = STATUS_UI[v];
        return `<div class="flex items-center justify-between bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2">
          <span class="text-sm font-semibold text-slate-200">${FB_SECTIONS[k]}</span>
          <span class="text-xs font-bold ${ui.cls}">${ui.e} ${v === 'none' ? 'Nicht trainiert' : ui.word}</span>
        </div>`;
      }).join('');

      let html = `
        <div class="space-y-4">
          <div class="${BOX}">
            <div class="flex items-center justify-between"><span class="text-sm font-bold text-white">Meine Verbesserungen</span><span class="text-[11px] text-slate-400">${fmtDate(entry.date)}</span></div>
            ${overview}
            <p class="text-[11px] text-slate-500">Jeder Bereich wird nur mit dem letzten Training derselben Kategorie verglichen.</p>
          </div>`;

      if (entry.dribbling) {
        const dr = entry.dribbling, x = a.dribbling;
        html += `
          <div class="${BOX}">
            <div class="flex items-center justify-between"><h4 class="font-bold text-white text-sm">Dribbling – ${esc(dr.parcours)}</h4>${verdictBadge(x.verdict)}</div>
            <div class="grid grid-cols-3 gap-2">
              ${statTile('Versuche', dr.attempts !== null ? dr.attempts : '–', dr.attempts !== null ? `${dr.success} erfolgreich | ${dr.attempts - dr.success} Fehler` : '')}
              ${statTile('Erfolgsquote', x.cur.rate !== null ? fmtN(x.cur.rate, 1) + ' %' : '–')}
              ${statTile('Beste / Ø Zeit', x.cur.best !== null ? fmtN(x.cur.best, 2) + ' s' : '–', x.cur.avg !== null ? 'Ø ' + fmtN(x.cur.avg, 2) + ' s' : '')}
            </div>
            ${dr.times.length ? `<div class="text-[11px] text-slate-500">Durchgänge: ${dr.times.map((t, i) => `#${i + 1} ${fmtN(t, 2)} s`).join(' | ')}</div>` : ''}
            ${x.prev ? `<p class="text-[11px] text-slate-500">Vergleich mit ${fmtDate(x.prev.date)}</p>${x.rows.map(r => cmpRow(r[0], r[1], r[2])).join('')}` : firstNote()}
          </div>`;
      }

      if (entry.shots) {
        html += `<div class="${BOX}"><div class="flex items-center justify-between"><h4 class="font-bold text-white text-sm">Schuss</h4>${verdictBadge(a.shots.verdict)}</div>`;
        a.shots.blocks.forEach(b => {
          const R = b.feet.R, L = b.feet.L;
          let better = '';
          if (R && L) {
            const diff = R.st.rate - L.st.rate;
            better = Math.abs(diff) < 1e-9 ? 'Beide Füße gleich stark.' : `${diff > 0 ? 'Rechter' : 'Linker'} Fuß war besser (+${fmtN(Math.abs(diff), 2)} %-Punkte).`;
          }
          html += `
            <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-3 space-y-2">
              <span class="text-xs font-bold text-slate-200">${b.type.name}</span>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${['R', 'L'].filter(f => b.feet[f]).map(f => {
                  const F = b.feet[f];
                  return `<div class="bg-slate-900/70 rounded-xl p-2.5 border border-slate-800 flex gap-3 items-start">
                    ${zoneHeat(F.arr)}
                    <div class="text-xs space-y-0.5">
                      <div class="font-bold text-white">${FOOT[f]}</div>
                      <div class="text-slate-300">${F.st.n} Schüsse | <b class="text-emerald-400">${F.st.goals} Tore</b></div>
                      <div class="text-lg font-black text-white">${fmtN(F.st.rate, 2)} %</div>
                      <div class="text-[10px] text-slate-500">${F.st.saved} gehalten | ${F.st.miss} daneben</div>
                    </div>
                  </div>`;
                }).join('')}
              </div>
              ${better ? `<p class="text-xs font-semibold text-blue-300">${better}</p>` : ''}
              ${['R', 'L'].filter(f => b.feet[f]).map(f => b.feet[f].prev
                ? cmpRow(`${FOOT[f]} vs. ${fmtDate(b.feet[f].prev.date)}`, b.feet[f].c, { unit: ' %', d: 2, deltaUnit: ' %-Pkt.' })
                : `<p class="text-[11px] text-slate-500 italic">${FOOT[f]}: Erster Eintrag – Vergleich ist ab dem nächsten Training möglich.</p>`).join('')}
            </div>`;
        });
        html += `</div>`;
      }

      if (entry.passes) {
        const p = entry.passes;
        html += `
          <div class="${BOX}">
            <div class="flex items-center justify-between"><h4 class="font-bold text-white text-sm">Passspiel</h4>${verdictBadge(a.passes.verdict)}</div>
            <div class="grid grid-cols-3 gap-2">
              ${Object.keys(PASS_TYPES).filter(k => p[k]).map(k => statTile(PASS_TYPES[k].replace(' (2–8 m)', ''), fmtN(rate(p[k].success, p[k].attempts), 1) + ' %', `${p[k].success}/${p[k].attempts} | ${p[k].attempts - p[k].success} Fehlpässe`)).join('')}
            </div>
            ${p.long ? `<p class="text-[11px] text-slate-400">Lange Pässe: Ziel ${p.long.target ? fmtN(p.long.target, 1) + ' m' : '–'} | weitester Pass ${p.long.max ? fmtN(p.long.max, 1) + ' m' : '–'}${p.long.dists && p.long.dists.length ? ` | Ø ${fmtN(mean(p.long.dists), 1)} m` : ''}</p>` : ''}
            ${a.passes.rows.every(r => r[1].status === 'first') ? firstNote() : a.passes.rows.map(r => cmpRow(r[0], r[1], r[2])).join('')}
          </div>`;
      }

      if (entry.sprint) {
        html += `<div class="${BOX}"><div class="flex items-center justify-between"><h4 class="font-bold text-white text-sm">Geschwindigkeit</h4>${verdictBadge(a.sprint.verdict)}</div>`;
        a.sprint.groups.forEach(g => {
          html += `<div class="space-y-1.5"><span class="text-xs font-bold text-slate-200">${SPRINT_VAR[g.v]}</span>
            ${g.rows.map(r => cmpRow(`${r.dist} m (${r.cur.tries.map(t => fmtN(t, 2)).join(' / ')} s) | Ø ${fmtN(r.kmh, 1)} km/h`, r.c, { unit: ' s', time: true })).join('')}
            ${g.rows.every(r => r.c.status === 'first') ? firstNote() : ''}
          </div>`;
        });
        html += `</div>`;
      }

      if (entry.notes) html += `<div class="${BOX}"><span class="${LBL}">Notizen</span><p class="text-sm text-slate-300 whitespace-pre-line">${esc(entry.notes)}</p></div>`;

      html += `<div class="grid grid-cols-2 gap-2 pb-2">
          <button onclick="openFootballForm('training')" class="${BTN_GHOST}">Neues Training</button>
          <button onclick="openFootballHistory()" class="${BTN_GHOST}">Verlauf</button>
        </div></div>`;
      openPerfModal(justSaved ? 'Training gespeichert' : 'Fußball-Analyse', 'bar-chart-3', html);
    }

    // ----- Match -----
    function renderMatchForm() {
      const m = fbDraft.match;
      const f = (key, label, opts = {}) => `<div class="${opts.span || ''}"><label class="${LBL}">${label}</label>${fbIn('match.' + key, m[key], opts)}</div>`;
      return `
        <div class="${BOX}">
          <div class="grid grid-cols-2 gap-2">
            <div><label class="${LBL}">Datum</label><input type="date" value="${fbDraft.date}" onchange="fbDraft.date=this.value;fbPersist()" class="${INP}"></div>
            <div><label class="${LBL}">Wettbewerb</label>
              <select onchange="fbSet('match.competition', this.value)" class="${INP}">
                ${['Liga', 'Cup', 'Testspiel', 'Turnier'].map(c => `<option ${m.competition === c ? 'selected' : ''}>${c}</option>`).join('')}
              </select></div>
            ${f('opponent', 'Gegner', { type: 'text', span: 'col-span-2' })}
            ${f('teamGoals', 'Tore eigenes Team', { mode: 'numeric' })}
            ${f('oppGoals', 'Tore Gegner', { mode: 'numeric' })}
            ${f('minutes', 'Gespielte Minuten', { mode: 'numeric' })}
            ${f('position', 'Position', { type: 'text', ph: 'z. B. Flügel' })}
          </div>
        </div>
        <div class="${BOX}">
          <span class="text-xs font-bold text-slate-200">Meine Leistung</span>
          <div class="grid grid-cols-3 gap-2">
            ${f('goals', 'Tore', { mode: 'numeric' })}
            ${f('assists', 'Assists', { mode: 'numeric' })}
            ${f('shotsOnTarget', 'Schüsse aufs Tor', { mode: 'numeric' })}
            ${f('duelsWon', 'Zweikämpfe gew.', { mode: 'numeric' })}
            ${f('duelsTotal', 'Zweikämpfe ges.', { mode: 'numeric' })}
            ${f('ballLosses', 'Ballverluste', { mode: 'numeric' })}
          </div>
          ${f('rating', 'Eigene Note (1–10)', { ph: 'z. B. 7,5' })}
          <div><label class="${LBL}">Notizen</label><textarea rows="2" oninput="fbSet('match.notes', this.value)" class="${INP}" placeholder="Was lief gut, was nicht?">${esc(m.notes)}</textarea></div>
        </div>
        <div class="flex gap-2 pb-2">
          <button onclick="fbSaveMatch()" class="${BTN_PRIMARY} flex-1">Match speichern</button>
          <button onclick="fbDiscard()" class="px-4 py-3 bg-rose-600/20 text-rose-400 border border-rose-500/30 rounded-xl font-bold text-sm">Verwerfen</button>
        </div>`;
    }

    function fbSaveMatch() {
      const m = fbDraft.match;
      const rating = num(m.rating);
      if (rating !== null && (rating < 1 || rating > 10)) return alert('Die Note muss zwischen 1 und 10 liegen.');
      const entry = {
        id: uid(), createdAt: Date.now(), date: fbDraft.date || getTodayString(),
        opponent: m.opponent.trim(), competition: m.competition, teamGoals: num(m.teamGoals), oppGoals: num(m.oppGoals),
        minutes: num(m.minutes), position: m.position.trim(), goals: num(m.goals), assists: num(m.assists),
        shotsOnTarget: num(m.shotsOnTarget), duelsWon: num(m.duelsWon), duelsTotal: num(m.duelsTotal),
        ballLosses: num(m.ballLosses), rating, notes: m.notes.trim()
      };
      if (entry.duelsWon !== null && entry.duelsTotal !== null && entry.duelsWon > entry.duelsTotal) return alert('Mehr gewonnene Zweikämpfe als Zweikämpfe insgesamt.');
      if (!entry.opponent && entry.minutes === null && entry.rating === null) return alert('Bitte mindestens Gegner, Minuten oder Note eintragen.');
      currentUser.perf.matches.push(entry);
      saveUserData();
      fbDraft.match = newFbDraft().match;
      fbPersist();
      showMatchAnalysis(entry.id, true);
    }

    function matchAnalyze(entry) {
      const prev = previousOf(currentUser.perf.matches, entry);
      const g = (o, k) => o ? o[k] : null;
      const duel = o => o && o.duelsTotal ? rate(o.duelsWon, o.duelsTotal) : null;
      const rows = [
        ['Eigene Note', cmpVal(entry.rating, g(prev, 'rating')), { d: 1 }],
        ['Minuten', cmpVal(entry.minutes, g(prev, 'minutes')), { unit: ' min', d: 0 }],
        ['Tore', cmpVal(entry.goals, g(prev, 'goals')), { d: 0 }],
        ['Assists', cmpVal(entry.assists, g(prev, 'assists')), { d: 0 }],
        ['Schüsse aufs Tor', cmpVal(entry.shotsOnTarget, g(prev, 'shotsOnTarget')), { d: 0 }],
        ['Zweikampfquote', cmpVal(duel(entry), duel(prev)), { unit: ' %', d: 1, deltaUnit: ' %-Pkt.' }],
        ['Ballverluste', cmpVal(entry.ballLosses, g(prev, 'ballLosses'), false), { d: 0 }]
      ];
      return { prev, rows, verdict: prev ? verdict(rows.map(r => r[1].status)) : 'first' };
    }

    function showMatchAnalysis(id, justSaved = false) {
      const e = currentUser.perf.matches.find(x => x.id === id);
      if (!e) return;
      const a = matchAnalyze(e);
      let res = '';
      if (e.teamGoals !== null && e.oppGoals !== null) {
        const r = e.teamGoals > e.oppGoals ? ['Sieg', 'text-emerald-400'] : (e.teamGoals < e.oppGoals ? ['Niederlage', 'text-rose-400'] : ['Unentschieden', 'text-amber-300']);
        res = `<span class="${r[1]} font-black">${e.teamGoals}:${e.oppGoals} ${r[0]}</span>`;
      }
      openPerfModal(justSaved ? 'Match gespeichert' : 'Match-Analyse', 'swords', `
        <div class="space-y-4">
          <div class="${BOX}">
            <div class="flex justify-between items-center"><span class="font-bold text-white">${esc(e.opponent || 'Match')}</span>${verdictBadge(a.verdict)}</div>
            <div class="text-xs text-slate-400">${fmtDate(e.date)} | ${esc(e.competition)} ${e.position ? '| ' + esc(e.position) : ''}</div>
            ${res ? `<div class="text-sm">${res}</div>` : ''}
            <div class="grid grid-cols-3 gap-2">
              ${statTile('Tore', e.goals !== null ? e.goals : '–')}${statTile('Assists', e.assists !== null ? e.assists : '–')}${statTile('Note', e.rating !== null ? fmtN(e.rating, 1) : '–')}
            </div>
          </div>
          ${a.prev ? `<div class="space-y-1.5"><span class="text-xs font-bold text-slate-300">Vergleich mit letztem Match (${fmtDate(a.prev.date)}${a.prev.opponent ? ' vs. ' + esc(a.prev.opponent) : ''})</span>
            ${a.rows.map(r => cmpRow(r[0], r[1], r[2])).join('')}</div>` : firstNote().replace('Training', 'Match')}
          ${e.notes ? `<div class="${BOX}"><span class="${LBL}">Notizen</span><p class="text-sm text-slate-300 whitespace-pre-line">${esc(e.notes)}</p></div>` : ''}
          <div class="grid grid-cols-2 gap-2 pb-2">
            <button onclick="openFootballForm('match')" class="${BTN_GHOST}">Neues Match</button>
            <button onclick="openFootballHistory()" class="${BTN_GHOST}">Verlauf</button>
          </div>
        </div>`);
    }

    function openFootballHistory() {
      const items = sortChrono(currentUser.perf.football.map(e => Object.assign({ _t: 'training' }, e))
        .concat(currentUser.perf.matches.map(e => Object.assign({ _t: 'match' }, e)))).reverse();
      const html = items.length ? items.map(e => {
        if (e._t === 'match') {
          const a = matchAnalyze(e);
          return `<div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-3 flex justify-between items-start gap-2">
            <div><div class="font-bold text-white text-sm">⚽ Match ${fmtDate(e.date)}${e.opponent ? ' vs. ' + esc(e.opponent) : ''}</div>
              <div class="text-[11px] text-slate-400">${e.teamGoals !== null && e.oppGoals !== null ? e.teamGoals + ':' + e.oppGoals + ' | ' : ''}Note ${e.rating !== null ? fmtN(e.rating, 1) : '–'} | ${STATUS_UI[a.verdict].e}</div>
              <button onclick="showMatchAnalysis('${e.id}')" class="text-xs text-blue-400 hover:underline mt-1">Analyse ansehen</button></div>
            <button onclick="fbDelete('match','${e.id}')" class="text-slate-600 hover:text-rose-400 p-1" aria-label="Löschen"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>`;
        }
        const a = fbAnalyze(e);
        const secs = Object.keys(FB_SECTIONS).filter(k => a[k].verdict !== 'none').map(k => `${STATUS_UI[a[k].verdict].e} ${FB_SECTIONS[k]}`).join(' | ');
        return `<div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-3 flex justify-between items-start gap-2">
          <div><div class="font-bold text-white text-sm">Training ${fmtDate(e.date)}</div>
            <div class="text-[11px] text-slate-400">${secs}</div>
            <button onclick="showFootballAnalysis('${e.id}')" class="text-xs text-blue-400 hover:underline mt-1">Analyse ansehen</button></div>
          <button onclick="fbDelete('training','${e.id}')" class="text-slate-600 hover:text-rose-400 p-1" aria-label="Löschen"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>`;
      }).join('') : '<p class="text-sm text-slate-500 italic">Noch keine Fußball-Einträge.</p>';
      openPerfModal('Fußball-Verlauf', 'history', `<div class="space-y-2">
        <div class="grid grid-cols-2 gap-2"><button onclick="openFootballForm('training')" class="${BTN_PRIMARY}">+ Training</button><button onclick="openFootballForm('match')" class="${BTN_PRIMARY} !bg-emerald-600 hover:!bg-emerald-500">+ Match</button></div>
        ${html}</div>`);
    }

    function fbDelete(kind, id) {
      if (!confirm('Eintrag löschen?')) return;
      const key = kind === 'match' ? 'matches' : 'football';
      currentUser.perf[key] = currentUser.perf[key].filter(e => e.id !== id);
      saveUserData(); openFootballHistory();
    }

    function renderFootballCard() {
      const p = currentUser.perf;
      const last = lastOf(p.football);
      const lastMatch = lastOf(p.matches);
      let body = '';
      if (!last) {
        body = `<p class="text-xs text-slate-400">Ziel: Profifußballer. Trag deine erste Einheit ein – Dribbling, Schuss, Pässe oder Sprint.</p>`;
      } else {
        const a = fbAnalyze(last);
        // jeweils der letzte Wert jeder Kategorie, egal aus welchem Training
        const lastWith = pred => { const s = sortChrono(p.football).filter(pred); return s.length ? s[s.length - 1] : null; };
        const ld = lastWith(e => e.dribbling), ls = lastWith(e => e.shots), lp = lastWith(e => e.passes), lsp = lastWith(e => e.sprint);
        const shotTxt = ls ? ['R', 'L'].map(f => {
          const arr = SHOT_TYPES.reduce((acc, t) => acc.concat(ls.shots[t.id] && ls.shots[t.id][f] ? ls.shots[t.id][f] : []), []);
          return arr.length ? `${f} ${fmtN(shotStats(arr).rate, 0)} %` : '';
        }).filter(Boolean).join(' | ') : '–';
        const passTxt = lp ? (() => { const all = Object.values(lp.passes); const s = all.reduce((x, y) => x + y.success, 0), t = all.reduce((x, y) => x + y.attempts, 0); return fmtN(rate(s, t), 0) + ' %'; })() : '–';
        const sprintTxt = lsp ? (() => { const v = lsp.sprint.noBall || lsp.sprint.withBall; const k = Object.keys(v)[0]; return `${k} m ${fmtN(v[k].best, 2)} s`; })() : '–';
        const dribTxt = ld ? (ld.dribbling.attempts ? fmtN(rate(ld.dribbling.success, ld.dribbling.attempts), 0) + ' %' : (ld.dribbling.times.length ? fmtN(Math.min(...ld.dribbling.times), 2) + ' s' : '–')) : '–';
        const cell = (k, val) => `<div class="bg-slate-950/80 p-2 rounded-xl border border-slate-800/80">
            <div class="flex justify-between text-[10px] text-slate-400"><span>${FB_SECTIONS[k]}</span><span>${(STATUS_UI[a[k].verdict] || STATUS_UI.none).e}</span></div>
            <div class="text-sm font-black text-white truncate">${val}</div></div>`;
        body = `
          <p class="text-xs text-slate-400">Letzte Einheit: <span class="text-white font-semibold">${fmtDate(last.date)}</span></p>
          <div class="grid grid-cols-2 gap-2">${cell('dribbling', dribTxt)}${cell('shots', shotTxt)}${cell('passes', passTxt)}${cell('sprint', sprintTxt)}</div>
          <p class="text-[10px] text-slate-500">Werte: letzter Stand je Kategorie. Farbe: Trend der letzten Einheit.</p>`;
      }
      if (lastMatch) {
        body += `<p class="text-xs text-slate-400">Letztes Match: <span class="text-white">${fmtDate(lastMatch.date)}${lastMatch.opponent ? ' vs. ' + esc(lastMatch.opponent) : ''}</span>${lastMatch.rating !== null ? ` | Note ${fmtN(lastMatch.rating, 1)}` : ''}</p>`;
      }
      const draft = loadDraft('football');
      const hasDraft = draft && draft.mode === 'training' && SHOT_TYPES.some(t => draft.shots.data[t.id].R.length || draft.shots.data[t.id].L.length);
      return `
        <div class="space-y-3">
          ${body}
          ${hasDraft ? `<p class="text-[11px] text-amber-300">Du hast eine nicht gespeicherte Einheit – tippe auf „+ Training“, um weiterzumachen.</p>` : ''}
          <div class="grid grid-cols-3 gap-2">
            <button onclick="openFootballForm('training')" class="py-2 bg-blue-600 hover:bg-blue-500 font-bold text-xs text-white rounded-xl transition">+ Training</button>
            <button onclick="openFootballForm('match')" class="py-2 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white rounded-xl transition">+ Match</button>
            <button onclick="openFootballHistory()" class="${BTN_GHOST}">Verlauf</button>
          </div>
        </div>`;
    }

    // =====================================================================
    // ==========================  SOCIAL MEDIA  ===========================
    // =====================================================================
    const PLATFORMS = {
      tiktok: { name: 'TikTok', icon: 'music-2', cls: 'text-pink-400' },
      instagram: { name: 'Instagram', icon: 'camera', cls: 'text-fuchsia-400' },
      youtube: { name: 'YouTube', icon: 'play', cls: 'text-red-400' }
    };
    const SM_METRICS = [
      ['views', 'Views'], ['likes', 'Likes'], ['comments', 'Kommentare'], ['shares', 'Shares'], ['followers', 'Neue Follower']
    ];

    let smDraft = null;

    function newSmDraft() { return { id: null, platform: 'tiktok', date: getTodayString(), desc: '', views: '', likes: '', comments: '', shares: '', followers: '' }; }

    function openSocialForm(editId) {
      if (editId) {
        const p = currentUser.perf.social.posts.find(x => x.id === editId);
        smDraft = { id: p.id, platform: p.platform, date: p.date, desc: p.desc };
        SM_METRICS.forEach(m => smDraft[m[0]] = p[m[0]] !== null && p[m[0]] !== undefined ? String(p[m[0]]) : '');
      } else smDraft = newSmDraft();
      openPerfModal(editId ? 'Post aktualisieren' : 'Post eintragen', 'share-2', '');
      renderSocialForm();
    }

    function renderSocialForm() {
      const d = smDraft;
      setPerfBody(`
        <div class="space-y-4">
          <div class="${BOX}">
            <label class="${LBL}">Plattform</label>
            <div class="grid grid-cols-3 gap-1.5">
              ${Object.keys(PLATFORMS).map(k => `<button onclick="smDraft.platform='${k}';renderSocialForm()" class="${chipCls(d.platform === k, 'pink')}">${PLATFORMS[k].name}</button>`).join('')}
            </div>
            <div><label class="${LBL}">Datum</label><input type="date" value="${d.date}" onchange="smDraft.date=this.value" class="${INP}"></div>
            <div><label class="${LBL}">Content / Video-Beschreibung</label><input value="${esc(d.desc)}" oninput="smDraft.desc=this.value" placeholder="z. B. Football training" class="${INP}"></div>
          </div>
          <div class="${BOX}">
            <div class="grid grid-cols-2 gap-2">
              ${SM_METRICS.map(m => `<div class="${m[0] === 'followers' ? 'col-span-2' : ''}"><label class="${LBL}">${m[1]}</label>
                <input inputmode="numeric" value="${esc(d[m[0]])}" oninput="smDraft['${m[0]}']=this.value" class="${INP}" placeholder="${m[0] === 'followers' ? 'z. B. 30 (durch diesen Post gewonnen)' : '0'}"></div>`).join('')}
            </div>
            <p class="text-[11px] text-slate-500">Tipp: Werte wachsen nach dem Posten weiter. Trag sie z. B. nach 48 h nochmal über „Bearbeiten“ ein – immer zum gleichen Zeitpunkt, dann ist der Vergleich fair.</p>
          </div>
          <button onclick="smSave()" class="${BTN_PRIMARY}">${d.id ? 'Änderungen speichern' : 'Post speichern'}</button>
        </div>`, true);
    }

    function smSave() {
      const d = smDraft;
      const post = { platform: d.platform, date: d.date || getTodayString(), desc: d.desc.trim() };
      for (const m of SM_METRICS) {
        const v = num(String(d[m[0]]).replace(/[.'’\s]/g, ''));
        if (v !== null && v < 0 && m[0] !== 'followers') return alert(`${m[1]} kann nicht negativ sein.`);
        post[m[0]] = v;
      }
      if (post.views === null && post.likes === null) return alert('Bitte mindestens Views oder Likes eintragen.');
      const posts = currentUser.perf.social.posts;
      let id = d.id;
      if (id) {
        const p = posts.find(x => x.id === id);
        Object.assign(p, post);
      } else {
        id = uid();
        posts.push(Object.assign({ id, createdAt: Date.now() }, post));
      }
      saveUserData();
      showPostAnalysis(id, true);
    }

    function engagement(p) {
      return p.views ? (((p.likes || 0) + (p.comments || 0) + (p.shares || 0)) / p.views) * 100 : null;
    }

    function postCompareRows(post) {
      const prev = previousOf(currentUser.perf.social.posts, post, x => x.platform === post.platform);
      const rows = SM_METRICS.map(m => [m[1], cmpVal(post[m[0]], prev ? prev[m[0]] : null), { d: 0, pct: true }]);
      rows.push(['Engagement-Rate', cmpVal(engagement(post), prev ? engagement(prev) : null), { unit: ' %', d: 2, deltaUnit: ' %-Pkt.' }]);
      return { prev, rows };
    }

    function platformStats() {
      const posts = currentUser.perf.social.posts;
      const stats = {};
      Object.keys(PLATFORMS).forEach(k => {
        const ps = posts.filter(p => p.platform === k);
        const avg = key => { const v = ps.map(p => p[key]).filter(x => x !== null && x !== undefined); return v.length ? mean(v) : null; };
        const sum = key => ps.reduce((s, p) => s + (p[key] || 0), 0);
        stats[k] = { count: ps.length };
        SM_METRICS.forEach(m => { stats[k][m[0]] = avg(m[0]); stats[k]['sum_' + m[0]] = sum(m[0]); });
      });
      return stats;
    }

    function platformRanking() {
      const stats = platformStats();
      const active = Object.keys(PLATFORMS).filter(k => stats[k].count > 0);
      const winners = {};
      SM_METRICS.forEach(m => {
        let best = null;
        active.forEach(k => { if (stats[k][m[0]] !== null && (best === null || stats[k][m[0]] > stats[best][m[0]])) best = k; });
        winners[m[0]] = best;
      });
      const wins = {}; active.forEach(k => wins[k] = SM_METRICS.filter(m => winners[m[0]] === k).length);
      const overall = active.length ? active.slice().sort((a, b) => wins[b] - wins[a] || (stats[b].views || 0) - (stats[a].views || 0))[0] : null;
      return { stats, active, winners, wins, overall };
    }

    function rankingHTML() {
      const r = platformRanking();
      if (!r.active.length) return '';
      const where = { views: 'die meisten Views', likes: 'die meisten Likes', comments: 'die meisten Kommentare', shares: 'die meisten Shares', followers: 'die meisten Follower' };
      return `
        <div class="${BOX}">
          <span class="text-sm font-bold text-white">Plattform-Vergleich (Ø pro Post)</span>
          ${r.active.length > 1 ? `<div class="bg-blue-600/10 border border-blue-500/30 rounded-xl p-3 text-sm text-blue-100">
            Am besten läuft <b>${PLATFORMS[r.overall].name}</b> – vorne bei ${r.wins[r.overall]} von 5 Kennzahlen.</div>` : `<p class="text-[11px] text-slate-500">Sobald du auf mehreren Plattformen postest, siehst du hier, wo es am besten läuft.</p>`}
          <div class="overflow-x-auto">
            <table class="w-full text-left text-[11px] text-slate-300">
              <thead class="text-[10px] uppercase text-slate-400"><tr><th class="p-1.5"></th>${r.active.map(k => `<th class="p-1.5 ${PLATFORMS[k].cls}">${PLATFORMS[k].name}</th>`).join('')}</tr></thead>
              <tbody class="divide-y divide-slate-800/60">
                <tr><td class="p-1.5 text-slate-400">Posts</td>${r.active.map(k => `<td class="p-1.5">${r.stats[k].count}</td>`).join('')}</tr>
                ${SM_METRICS.map(m => `<tr><td class="p-1.5 text-slate-400">${m[1]}</td>${r.active.map(k => `<td class="p-1.5 ${r.winners[m[0]] === k && r.active.length > 1 ? 'text-emerald-400 font-bold' : ''}">${fmtN(r.stats[k][m[0]], 0)}</td>`).join('')}</tr>`).join('')}
              </tbody>
            </table>
          </div>
          ${r.active.length > 1 ? `<ul class="text-[11px] text-slate-400 space-y-0.5">${SM_METRICS.map(m => r.winners[m[0]] ? `<li>${where[m[0]]}: <span class="text-white">${PLATFORMS[r.winners[m[0]]].name}</span></li>` : '').join('')}</ul>` : ''}
        </div>`;
    }

    function showPostAnalysis(id, justSaved = false) {
      const post = currentUser.perf.social.posts.find(x => x.id === id);
      if (!post) return;
      const { prev, rows } = postCompareRows(post);
      const v = prev ? verdict(rows.slice(0, 5).map(r => r[1].status)) : 'first';
      openPerfModal(justSaved ? 'Post gespeichert' : 'Post-Analyse', 'bar-chart-3', `
        <div class="space-y-4">
          <div class="${BOX}">
            <div class="flex justify-between items-center"><span class="font-bold ${PLATFORMS[post.platform].cls}">${PLATFORMS[post.platform].name}</span>${verdictBadge(v)}</div>
            <div class="text-xs text-slate-400">${fmtDate(post.date)}${post.desc ? ' | ' + esc(post.desc) : ''}</div>
            <div class="grid grid-cols-3 gap-2">
              ${statTile('Views', fmtN(post.views, 0))}${statTile('Likes', fmtN(post.likes, 0))}${statTile('Follower', (post.followers > 0 ? '+' : '') + fmtN(post.followers, 0))}
            </div>
          </div>
          ${prev ? `<div class="space-y-1.5"><span class="text-xs font-bold text-slate-300">vs. letzter ${PLATFORMS[post.platform].name}-Post (${fmtDate(prev.date)})</span>
            ${rows.map(r => cmpRow(r[0], r[1], r[2])).join('')}</div>`
          : `<p class="text-[11px] text-slate-400 italic bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2">Erster ${PLATFORMS[post.platform].name}-Post – Vergleich ist ab dem nächsten ${PLATFORMS[post.platform].name}-Post möglich.</p>`}
          ${rankingHTML()}
          <div class="grid grid-cols-2 gap-2 pb-2">
            <button onclick="openSocialForm('${post.id}')" class="${BTN_GHOST}">Werte bearbeiten</button>
            <button onclick="openSocialAnalysis()" class="${BTN_GHOST}">Alle Posts</button>
          </div>
        </div>`);
    }

    function smStreak() {
      const dates = new Set(currentUser.perf.social.posts.map(p => p.date));
      let d = getTodayString();
      if (!dates.has(d)) d = addDays(d, -1); // heute zählt noch nicht als verpasst
      let n = 0;
      while (dates.has(d)) { n++; d = addDays(d, -1); }
      return n;
    }

    function openSocialAnalysis() {
      const posts = sortChrono(currentUser.perf.social.posts).reverse();
      const list = posts.length ? posts.map(p => `
        <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-3 flex justify-between gap-2">
          <div class="min-w-0">
            <div class="text-sm font-bold"><span class="${PLATFORMS[p.platform].cls}">${PLATFORMS[p.platform].name}</span> <span class="text-slate-400 font-normal text-xs">${fmtDate(p.date)}</span></div>
            <div class="text-[11px] text-slate-400 truncate">${esc(p.desc) || '–'}</div>
            <div class="text-[11px] text-slate-500">${fmtN(p.views, 0)} Views | ${fmtN(p.likes, 0)} Likes | ${fmtN(p.comments, 0)} Komm. | ${fmtN(p.shares, 0)} Shares | ${p.followers > 0 ? '+' : ''}${fmtN(p.followers, 0)} Follower</div>
            <div class="flex gap-3 mt-1"><button onclick="showPostAnalysis('${p.id}')" class="text-xs text-blue-400 hover:underline">Vergleich</button><button onclick="openSocialForm('${p.id}')" class="text-xs text-blue-400 hover:underline">Bearbeiten</button></div>
          </div>
          <button onclick="smDelete('${p.id}')" class="text-slate-600 hover:text-rose-400 p-1 self-start" aria-label="Löschen"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>`).join('') : '<p class="text-sm text-slate-500 italic">Noch keine Posts eingetragen.</p>';
      openPerfModal('Social-Media-Analyse', 'share-2', `
        <div class="space-y-3">
          <button onclick="openSocialForm()" class="${BTN_PRIMARY}">+ Post eintragen</button>
          ${rankingHTML()}
          ${list}
        </div>`);
    }

    function smDelete(id) {
      if (!confirm('Diesen Post löschen?')) return;
      currentUser.perf.social.posts = currentUser.perf.social.posts.filter(p => p.id !== id);
      saveUserData(); openSocialAnalysis();
    }

    function renderSocialCard() {
      const posts = currentUser.perf.social.posts;
      const today = getTodayString();
      const todayPosts = posts.filter(p => p.date === today);
      const posted = todayPosts.length > 0;
      const days = []; for (let i = 6; i >= 0; i--) days.push(addDays(today, -i));
      const wk = posts.filter(p => p.date >= days[0] && p.date <= today);
      const sum = k => wk.reduce((s, p) => s + (p[k] || 0), 0);
      const streak = smStreak();
      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between p-3 rounded-2xl border ${posted ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-rose-500/10 border-rose-500/30'}">
            <div><span class="text-[10px] font-bold uppercase text-slate-400 block">Ziel: 1 Post pro Tag</span>
              <span class="text-sm font-black ${posted ? 'text-emerald-400' : 'text-rose-400'}">${posted ? 'Heute gepostet ✅' : 'Noch nicht gepostet ❌'}</span></div>
            <div class="text-right"><span class="text-[10px] text-slate-400 block">Serie</span><span class="text-sm font-black text-white">${streak} ${streak === 1 ? 'Tag' : 'Tage'}</span></div>
          </div>
          <div class="flex justify-between gap-1">
            ${days.map(d => { const has = posts.some(p => p.date === d); const wd = WEEKDAYS[(dateFromIso(d).getDay() + 6) % 7];
              return `<div class="flex-1 text-center"><div class="text-[9px] text-slate-500">${wd}</div><div class="mx-auto mt-0.5 w-6 h-6 rounded-lg border ${has ? 'bg-emerald-500/30 border-emerald-500/50' : 'bg-slate-900 border-slate-800'} ${d === today ? 'ring-1 ring-blue-500' : ''}"></div></div>`; }).join('')}
          </div>
          <div class="grid grid-cols-3 gap-2">
            ${statTile('Views 7 T.', fmtN(sum('views'), 0))}${statTile('Likes 7 T.', fmtN(sum('likes'), 0))}${statTile('Follower 7 T.', (sum('followers') > 0 ? '+' : '') + fmtN(sum('followers'), 0))}
          </div>
          <div class="flex gap-1.5 text-[11px]">
            ${Object.keys(PLATFORMS).map(k => `<span class="flex-1 text-center px-2 py-1 rounded-lg border border-slate-800 bg-slate-950/60 ${PLATFORMS[k].cls}">${PLATFORMS[k].name} ${todayPosts.some(p => p.platform === k) ? '✅' : '–'}</span>`).join('')}

          <div class="grid grid-cols-2 gap-2">

    // =====================================================================
    // ========================  HYGIENE & AUSSEHEN  =======================
    // =====================================================================
    function hygLogs(rid) { return currentUser.perf.hygiene.logs.filter(l => l.routineId === rid); }
    function hygHas(rid, date, slot) { return currentUser.perf.hygiene.logs.some(l => l.routineId === rid && l.date === date && (l.slot || null) === (slot || null)); }

    function hygToggle(rid, date, slot) {
      const logs = currentUser.perf.hygiene.logs;
      const i = logs.findIndex(l => l.routineId === rid && l.date === date && (l.slot || null) === (slot || null));
      if (i >= 0) logs.splice(i, 1); else logs.push({ routineId: rid, date, slot: slot || null, ts: Date.now() });
      saveUserData();
      renderDashboard();
    }

    function hygToggleSlot(rid, date, idx) {
      const r = currentUser.perf.hygiene.routines.find(x => x.id === rid);
      const slots = r && r.slots && r.slots.length ? r.slots : [null];
      hygToggle(rid, date, slots[idx]);
    }

    function hygWeekCount(r, refDate) {
      const ws = weekStart(refDate || getTodayString()), we = addDays(ws, 6);
      return new Set(hygLogs(r.id).filter(l => l.date >= ws && l.date <= we).map(l => l.date)).size;
    }

    function hygDailyDone(r, date) {
      const slots = r.slots && r.slots.length ? r.slots : [null];
      const done = slots.filter(s => hygHas(r.id, date, s)).length;
      return done === 0 ? 'none' : (done === slots.length ? 'full' : 'part');
    }

    function hygLastDate(r) { const d = hygLogs(r.id).map(l => l.date).sort(); return d.length ? d[d.length - 1] : null; }

    function renderRoutine(r) {
      const today = getTodayString();
      const head = `<div class="flex items-center gap-2 text-sm font-bold text-white"><i data-lucide="${r.icon || 'check-circle-2'}" class="w-4 h-4 text-blue-400"></i>${esc(r.name)}</div>`;
      if (r.kind === 'weekly') {
        const ws = weekStart(today);
        const n = hygWeekCount(r);
        const reached = n >= r.target;
        return `<div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800 space-y-2">
          <div class="flex justify-between items-center">${head}<span class="text-xs font-black ${reached ? 'text-emerald-400' : 'text-slate-300'}">${n}/${r.target}${reached ? ' erreicht ✅' : ' diese Woche'}</span></div>
          <div class="grid grid-cols-7 gap-1">
            ${WEEKDAYS.map((wd, i) => { const d = addDays(ws, i); const on = hygHas(r.id, d, null); const future = d > today;
              return `<button ${future ? 'disabled' : ''} onclick="hygToggle('${r.id}','${d}')" class="py-1.5 rounded-lg border text-[11px] font-bold transition ${on ? 'bg-emerald-500/25 border-emerald-500/50 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-500'} ${d === today ? 'ring-1 ring-blue-500' : ''} disabled:opacity-30">${on ? '☑' : '☐'}<br>${wd}</button>`; }).join('')}
          </div>
          <div class="h-1.5 bg-slate-800 rounded-full overflow-hidden"><div class="h-full ${reached ? 'bg-emerald-500' : 'bg-blue-500'}" style="width:${Math.min(100, n / r.target * 100)}%"></div></div>
        </div>`;
      }
      if (r.kind === 'interval') {
        const last = hygLastDate(r);
        const next = last ? addDays(last, r.days) : null;
        const overdue = next && next < today;
        const doneToday = hygHas(r.id, today, null);
        return `<div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800 space-y-2">
          ${head}
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div><span class="text-[10px] text-slate-400 block">Letztes Mal</span><span class="font-bold text-white">${last ? fmtDate(last) : '–'}</span>${last ? `<span class="text-[10px] text-slate-500 block">vor ${daysBetween(last, today)} Tagen</span>` : ''}</div>
            <div><span class="text-[10px] text-slate-400 block">Nächstes Mal (alle ${r.days} T.)</span><span class="font-bold ${overdue ? 'text-rose-400' : 'text-white'}">${next ? fmtDate(next) : 'jetzt'}</span>${overdue ? '<span class="text-[10px] text-rose-400 block">überfällig</span>' : ''}</div>
          </div>
          <button onclick="hygToggle('${r.id}','${today}')" class="w-full py-2 rounded-xl text-xs font-bold border transition ${doneToday ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300' : 'bg-blue-600 border-blue-500 text-white'}">${doneToday ? `✓ Heute erledigt (tippen zum Rückgängig)` : `${esc(r.name)} ✓`}</button>
        </div>`;
      }
      // daily
      const slots = r.slots && r.slots.length ? r.slots : [null];
      const days = []; for (let i = 6; i >= 0; i--) days.push(addDays(today, -i));
      return `<div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800 space-y-2">
        ${head}
        <div class="grid grid-cols-${slots.length} gap-2">
          ${slots.map(s => { const on = hygHas(r.id, today, s);
            return `<button onclick="hygToggleSlot('${r.id}','${today}',${slots.indexOf(s)})" class="py-2 rounded-xl text-xs font-bold border transition ${on ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300' : 'bg-slate-950 border-slate-700 text-slate-300'}">${on ? '☑' : '☐'} ${esc(s) || 'Heute verwendet'}</button>`; }).join('')}
        </div>
        <div class="flex justify-between gap-1">
          ${days.map(d => { const st = hygDailyDone(r, d); const wd = WEEKDAYS[(dateFromIso(d).getDay() + 6) % 7];
            return `<div class="flex-1 text-center"><div class="text-[9px] text-slate-500">${wd}</div><div class="mx-auto mt-0.5 w-5 h-5 rounded-md border ${st === 'full' ? 'bg-emerald-500/40 border-emerald-500/60' : st === 'part' ? 'bg-amber-500/30 border-amber-500/50' : 'bg-slate-950 border-slate-800'}"></div></div>`; }).join('')}
        </div>
      </div>`;
    }

    function renderHygieneCard() {
      const rs = currentUser.perf.hygiene.routines;
      return `<div class="space-y-3">
        ${rs.length ? rs.map(renderRoutine).join('') : '<p class="text-xs text-slate-500 italic">Keine Routinen. Füge unten eine hinzu.</p>'}
        <button onclick="openHygieneHistory()" class="${BTN_GHOST} w-full">Verlauf, nachtragen & Routinen verwalten</button>
      </div>`;
    }

    function openHygieneHistory() {
      const h = currentUser.perf.hygiene;
      const today = getTodayString();
      const blocks = h.routines.map(r => {
        let hist = '';
        if (r.kind === 'weekly') {
          const weeks = []; let ws = weekStart(today);
          for (let i = 0; i < 8; i++) { weeks.push(ws); ws = addDays(ws, -7); }
          hist = `<div class="space-y-1">${weeks.map(w => { const n = hygWeekCount(r, w);
            return `<div class="flex items-center gap-2 text-[11px]"><span class="w-24 text-slate-400">ab ${fmtDate(w)}</span>
              <div class="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden"><div class="h-full ${n >= r.target ? 'bg-emerald-500' : 'bg-blue-500'}" style="width:${Math.min(100, n / r.target * 100)}%"></div></div>
              <span class="w-12 text-right font-bold ${n >= r.target ? 'text-emerald-400' : 'text-slate-300'}">${n}/${r.target}</span></div>`; }).join('')}</div>`;
        } else if (r.kind === 'daily') {
          const days = []; for (let i = 29; i >= 0; i--) days.push(addDays(today, -i));
          const full = days.filter(d => hygDailyDone(r, d) === 'full').length;
          hist = `<div class="grid grid-cols-10 gap-1">${days.map(d => { const st = hygDailyDone(r, d);
            return `<div title="${fmtDate(d)}" class="h-5 rounded-md border text-[8px] flex items-center justify-center text-slate-400 ${st === 'full' ? 'bg-emerald-500/40 border-emerald-500/60' : st === 'part' ? 'bg-amber-500/30 border-amber-500/50' : 'bg-slate-950 border-slate-800'}">${dateFromIso(d).getDate()}</div>`; }).join('')}</div>
            <p class="text-[11px] text-slate-400">Letzte 30 Tage: <b class="text-white">${full}/30</b> Tage komplett</p>`;
        } else {
          const ds = [...new Set(hygLogs(r.id).map(l => l.date))].sort().reverse();
          hist = ds.length ? `<div class="flex flex-wrap gap-1">${ds.slice(0, 20).map(d => `<span class="px-2 py-0.5 rounded-md bg-slate-950 border border-slate-800 text-[11px] text-slate-300">${fmtDate(d)}</span>`).join('')}</div>` : '<p class="text-[11px] text-slate-500 italic">Noch keine Einträge.</p>';
        }
        const slotSel = r.kind === 'daily' && r.slots && r.slots.length
          ? `<select id="hyg-add-slot-${r.id}" class="${INP} !w-auto">${r.slots.map(s => `<option>${esc(s)}</option>`).join('')}</select>` : '';
        return `<div class="${BOX}">
          <div class="flex justify-between items-center"><span class="font-bold text-white text-sm">${esc(r.name)}</span>
            <button onclick="hygDeleteRoutine('${r.id}')" class="text-[11px] text-slate-500 hover:text-rose-400">Routine löschen</button></div>
          ${hist}
          <div class="flex gap-2 items-center">
            <input type="date" id="hyg-add-date-${r.id}" value="${today}" max="${today}" class="${INP}">
            ${slotSel}
            <button onclick="hygBackfill('${r.id}')" class="${BTN_GHOST} shrink-0">Nachtragen</button>
          </div>
        </div>`;
      }).join('');

      openPerfModal('Hygiene & Pflege', 'sparkles', `
        <div class="space-y-3">
          ${blocks}
          <div class="${BOX}">
            <span class="text-sm font-bold text-white">Neue Routine hinzufügen</span>
            <input id="hyg-new-name" placeholder="z. B. Gesichtspflege, Zähne Zahnseide, Haare schneiden" class="${INP}">
            <select id="hyg-new-kind" onchange="document.getElementById('hyg-new-extra-wrap').querySelector('label').innerText = {weekly:'Ziel pro Woche',interval:'Alle wie viele Tage?',daily:'Zeitpunkte (mit Komma, leer = 1× täglich)'}[this.value]" class="${INP}">
              <option value="weekly">Wochenziel (z. B. 3× pro Woche)</option>
              <option value="daily">Täglich abhaken</option>
              <option value="interval">Alle X Tage (wie Nägel)</option>
            </select>
            <div id="hyg-new-extra-wrap"><label class="${LBL}">Ziel pro Woche</label><input id="hyg-new-extra" placeholder="z. B. 3  oder  Morgens, Abends" class="${INP}"></div>
            <button onclick="hygAddRoutine()" class="${BTN_PRIMARY}">Routine hinzufügen</button>
          </div>
        </div>`);
    }

    function hygBackfill(rid) {
      const date = document.getElementById('hyg-add-date-' + rid).value;
      const slotEl = document.getElementById('hyg-add-slot-' + rid);
      const slot = slotEl ? slotEl.value : null;
      if (!date) return;
      if (hygHas(rid, date, slot)) return alert('Für dieses Datum ist schon ein Eintrag vorhanden.');
      currentUser.perf.hygiene.logs.push({ routineId: rid, date, slot, ts: Date.now() });
      saveUserData(); openHygieneHistory();
    }

    function hygAddRoutine() {
      const name = document.getElementById('hyg-new-name').value.trim();
      const kind = document.getElementById('hyg-new-kind').value;
      const extra = document.getElementById('hyg-new-extra').value.trim();
      if (!name) return alert('Bitte einen Namen eingeben.');
      const r = { id: uid(), name, icon: 'check-circle-2', kind };
      if (kind === 'weekly') { r.target = Math.max(1, Math.min(7, Math.round(num(extra) || 3))); }
      else if (kind === 'interval') { r.days = Math.max(1, Math.round(num(extra) || 7)); }
      else { r.slots = extra ? extra.split(',').map(s => s.trim()).filter(Boolean).slice(0, 3) : []; }
      currentUser.perf.hygiene.routines.push(r);
      saveUserData(); openHygieneHistory();
    }

    function hygDeleteRoutine(rid) {
      if (!confirm('Routine und ihren Verlauf löschen?')) return;
      const h = currentUser.perf.hygiene;
      h.routines = h.routines.filter(r => r.id !== rid);
      h.logs = h.logs.filter(l => l.routineId !== rid);
      saveUserData(); openHygieneHistory();
    }

    // =====================================================================
    // =======================  GESICHTSENTWICKLUNG  =======================
    // =====================================================================
    // Fotos liegen in IndexedDB (viel mehr Platz als localStorage), Metadaten im User-Objekt.
    const PhotoDB = {
      db: null,
      open() {
        return new Promise((res, rej) => {
          if (this.db) return res(this.db);
          const r = indexedDB.open('mylife_media', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('photos');
          r.onsuccess = () => { this.db = r.result; res(this.db); };
          r.onerror = () => rej(r.error);
        });
      },
      async tx(mode, fn) {
        const db = await this.open();
        return new Promise((res, rej) => {
          const t = db.transaction('photos', mode);
          const req = fn(t.objectStore('photos'));
          t.oncomplete = () => res(req ? req.result : undefined);
          t.onerror = () => rej(t.error);
        });
      },
      put(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
      get(k) { return this.tx('readonly', s => s.get(k)); },
      del(k) { return this.tx('readwrite', s => s.delete(k)); }
    };
    const photoCache = {};
    let facePending = null;
    let faceCmp = { a: null, b: null, overlay: false, mix: 50 };

    function photoKey(id) { return currentUser.username + ':' + id; }

    async function hydratePhotos(root) {
      const imgs = (root || document).querySelectorAll('img[data-photo-id]');
      for (const img of imgs) {
        const id = img.dataset.photoId;
        if (!photoCache[id]) { try { photoCache[id] = await PhotoDB.get(photoKey(id)); } catch (e) {} }
        if (photoCache[id]) img.src = photoCache[id];
      }
    }

    function compressImage(file, maxDim = 1080, quality = 0.82) {
      return new Promise((res, rej) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          res(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bild konnte nicht gelesen werden')); };
        img.src = url;
      });
    }

    const PH_IMG = 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 3 4%22><rect width=%223%22 height=%224%22 fill=%22%230f172a%22/></svg>';

    function openFaceUpload() {
      facePending = null;
      openPerfModal('Foto hinzufügen', 'camera', `
        <div class="space-y-4">
          <p class="text-xs text-slate-400">Für einen fairen Vergleich: gleiches Licht, gleicher Abstand, gerade in die Kamera.</p>
          <label class="block w-full aspect-[3/4] max-h-80 rounded-2xl border-2 border-dashed border-slate-700 bg-slate-900/60 overflow-hidden cursor-pointer relative">
            <img id="face-preview" class="w-full h-full object-cover hidden">
            <div id="face-preview-ph" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-sm gap-2"><i data-lucide="camera" class="w-8 h-8"></i>Foto aufnehmen oder auswählen</div>
            <input type="file" accept="image/*" class="hidden" onchange="faceFileChosen(event)">
          </label>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="${LBL}">Datum</label><input type="date" id="face-date" value="${getTodayString()}" max="${getTodayString()}" class="${INP}"></div>
            <div><label class="${LBL}">Beschreibung (optional)</label><input id="face-note" placeholder="z. B. nach Haarschnitt" class="${INP}"></div>
          </div>
          <button id="face-save-btn" onclick="faceSave()" class="${BTN_PRIMARY}">Foto speichern</button>
        </div>`);
    }

    async function faceFileChosen(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      try {
        facePending = await compressImage(file);
        const img = document.getElementById('face-preview');
        img.src = facePending; img.classList.remove('hidden');
        document.getElementById('face-preview-ph').classList.add('hidden');
      } catch (e) { alert(e.message); }
    }

    async function faceSave() {
      if (!facePending) return alert('Bitte zuerst ein Foto auswählen.');
      const btn = document.getElementById('face-save-btn');
      btn.disabled = true; btn.innerText = 'Speichert …';
      const id = uid();
      try {
        await PhotoDB.put(photoKey(id), facePending);
      } catch (e) {
        btn.disabled = false; btn.innerText = 'Foto speichern';
        return alert('Foto konnte nicht gespeichert werden (Speicher voll oder privater Modus).');
      }
      photoCache[id] = facePending;
      currentUser.perf.photos.push({ id, createdAt: Date.now(), date: document.getElementById('face-date').value || getTodayString(), note: document.getElementById('face-note').value.trim() });
      saveUserData();
      facePending = null;
      faceCmp = { a: null, b: null, overlay: false, mix: 50 };
      openFaceGallery();
    }

    function openFaceGallery() {
      const photos = sortChrono(currentUser.perf.photos);
      if (!photos.length) {
        openPerfModal('Gesichtsentwicklung', 'scan-face', `<div class="space-y-3 text-center py-6">
          <p class="text-sm text-slate-400">Noch keine Fotos. Lade dein erstes hoch – z. B. einmal im Monat.</p>
          <button onclick="openFaceUpload()" class="${BTN_PRIMARY}">+ Foto hinzufügen</button></div>`);
        return;
      }
      if (!faceCmp.a || !photos.find(p => p.id === faceCmp.a)) faceCmp.a = photos[0].id;
      if (!faceCmp.b || !photos.find(p => p.id === faceCmp.b)) faceCmp.b = photos[photos.length - 1].id;
      openPerfModal('Gesichtsentwicklung', 'scan-face', faceGalleryHTML());
      hydratePhotos(document.getElementById('perf-modal-body'));
    }

    function faceGalleryHTML() {
      const photos = sortChrono(currentUser.perf.photos);
      const A = photos.find(p => p.id === faceCmp.a), B = photos.find(p => p.id === faceCmp.b);
      const opt = sel => photos.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${fmtDate(p.date)}${p.note ? ' – ' + esc(p.note) : ''}</option>`).join('');
      const compare = photos.length >= 2 ? `
        <div class="${BOX}">
          <div class="flex justify-between items-center"><span class="text-sm font-bold text-white">Vergleich</span>
            <button onclick="faceCmp.overlay=!faceCmp.overlay;setPerfBody(faceGalleryHTML(),true)" class="${BTN_GHOST}">${faceCmp.overlay ? 'Nebeneinander' : 'Überblenden'}</button></div>
          <div class="grid grid-cols-2 gap-2">
            <select onchange="faceCmp.a=this.value;setPerfBody(faceGalleryHTML(),true)" class="${INP}">${opt(faceCmp.a)}</select>
            <select onchange="faceCmp.b=this.value;setPerfBody(faceGalleryHTML(),true)" class="${INP}">${opt(faceCmp.b)}</select>
          </div>
          ${faceCmp.overlay ? `
            <div class="relative w-full max-w-sm mx-auto aspect-[3/4] rounded-xl overflow-hidden bg-slate-950">
              <img data-photo-id="${A.id}" src="${PH_IMG}" class="absolute inset-0 w-full h-full object-cover">
              <img id="face-overlay-top" data-photo-id="${B.id}" src="${PH_IMG}" style="opacity:${faceCmp.mix / 100}" class="absolute inset-0 w-full h-full object-cover">
            </div>
            <div class="flex items-center gap-2 text-[11px] text-slate-400"><span>Vorher</span>
              <input type="range" min="0" max="100" value="${faceCmp.mix}" oninput="faceCmp.mix=this.value;document.getElementById('face-overlay-top').style.opacity=this.value/100" class="flex-1 accent-blue-500"><span>Nachher</span></div>`
          : `<div class="grid grid-cols-2 gap-2">
              ${[[A, 'Vorher'], [B, 'Nachher']].map(x => `<figure class="space-y-1"><img data-photo-id="${x[0].id}" src="${PH_IMG}" class="w-full aspect-[3/4] object-cover rounded-xl bg-slate-950">
                <figcaption class="text-[11px] text-slate-400 text-center"><b class="text-slate-200">${x[1]}</b> | ${fmtDate(x[0].date)}</figcaption></figure>`).join('')}
            </div>`}
          <p class="text-[11px] text-slate-500 text-center">${Math.abs(daysBetween(A.date, B.date))} Tage dazwischen</p>
        </div>` : `<p class="text-[11px] text-slate-500">Ab dem zweiten Foto kannst du Vorher | Nachher vergleichen.</p>`;

      return `
        <div class="space-y-4">
          <button onclick="openFaceUpload()" class="${BTN_PRIMARY}">+ Foto hinzufügen</button>
          ${compare}
          <div class="space-y-3">
            <span class="text-xs font-bold text-slate-300">Zeitverlauf (${photos.length} Fotos)</span>
            ${photos.map(p => `
              <div class="flex gap-3 items-start bg-slate-900/60 border border-slate-800 rounded-2xl p-2.5">
                <img data-photo-id="${p.id}" src="${PH_IMG}" class="w-20 aspect-[3/4] object-cover rounded-xl bg-slate-950">
                <div class="flex-1 min-w-0">
                  <div class="text-sm font-bold text-white">${fmtDate(p.date)}</div>
                  <div class="text-[11px] text-slate-400">${esc(p.note) || ''}</div>
                </div>
                <button onclick="faceDelete('${p.id}')" class="text-slate-600 hover:text-rose-400 p-1" aria-label="Foto löschen"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>`).join('')}
          </div>
        </div>`;
    }

    async function faceDelete(id) {
      if (!confirm('Dieses Foto löschen?')) return;
      currentUser.perf.photos = currentUser.perf.photos.filter(p => p.id !== id);
      saveUserData();
      try { await PhotoDB.del(photoKey(id)); } catch (e) {}
      delete photoCache[id];
      openFaceGallery();
    }

    function renderFaceCard() {
      const photos = sortChrono(currentUser.perf.photos);
      const last = photos.length ? photos[photos.length - 1] : null;
      const recent = photos.slice(-3);
      return `<div class="space-y-3">
        ${last ? `<p class="text-xs text-slate-400">Letzter Upload: <span class="text-white font-semibold">${fmtDate(last.date)}</span> (vor ${daysBetween(last.date, getTodayString())} Tagen) | ${photos.length} Fotos</p>
          <div class="grid grid-cols-3 gap-2">${recent.map(p => `<figure><img data-photo-id="${p.id}" src="${PH_IMG}" class="w-full aspect-[3/4] object-cover rounded-xl bg-slate-950 border border-slate-800"><figcaption class="text-[10px] text-slate-500 text-center mt-0.5">${fmtDate(p.date)}</figcaption></figure>`).join('')}</div>`
        : `<p class="text-xs text-slate-400">Dokumentiere deine Entwicklung mit einem Foto pro Monat. Keine Bewertung – nur dein Zeitverlauf.</p>`}
        <div class="grid grid-cols-2 gap-2">
          <button onclick="openFaceUpload()" class="py-2 bg-blue-600 hover:bg-blue-500 font-bold text-xs text-white rounded-xl transition">+ Foto</button>
          <button onclick="openFaceGallery()" class="${BTN_GHOST}">Verlauf & Vergleich</button>
        </div>
      </div>`;
    }

    // =====================================================================
    // ========================  BACKUP EXPORT / IMPORT  ===================
    // =====================================================================
    async function exportBackup() {
      const data = JSON.parse(JSON.stringify(currentUser));
      delete data.password;
      const photos = {};
      for (const p of (currentUser.perf.photos || [])) {
        try { const v = photoCache[p.id] || await PhotoDB.get(photoKey(p.id)); if (v) photos[p.id] = v; } catch (e) {}
      }
      const blob = new Blob([JSON.stringify({ app: 'MyLife', version: 1, exportedAt: new Date().toISOString(), user: data, photos })], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `mylife-backup-${getTodayString()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }

    function importBackup(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const b = JSON.parse(reader.result);
          if (b.app !== 'MyLife' || !b.user) throw new Error('Keine MyLife-Sicherung.');
          if (!confirm('Backup einspielen? Deine aktuellen Daten in diesem Account werden ersetzt.')) return;
          const keep = { username: currentUser.username, password: currentUser.password };
          currentUser = Object.assign({}, b.user, keep);
          for (const id of Object.keys(b.photos || {})) { await PhotoDB.put(photoKey(id), b.photos[id]); photoCache[id] = b.photos[id]; }
          saveUserData();
          closeModal('modal-profile');
          updateNavProfile();
          renderDashboard();
          alert('Backup eingespielt.');
        } catch (e) { alert('Import fehlgeschlagen: ' + e.message); }
        ev.target.value = '';
      };
      reader.readAsText(file);
    }

  </script>
</body>
