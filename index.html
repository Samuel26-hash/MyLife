<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYLife – Personal Dashboard & Growth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="h-full font-sans antialiased selection:bg-blue-500 selection:text-white">

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
    <div class="glass w-full max-w-md p-8 rounded-3xl shadow-2xl space-y-6 border border-slate-800">
      <div class="text-center space-y-2">
        <div class="inline-flex p-3 bg-blue-600/20 text-blue-400 rounded-2xl mb-2">
          <i data-lucide="sparkles" class="w-8 h-8"></i>
        </div>
        <h1 class="text-3xl font-black tracking-tight text-white">MYLife</h1>
        <p class="text-slate-400 text-sm">Dein persönliches Entwicklungs-Dashboard</p>
      </div>

      <div class="flex p-1 bg-slate-900/80 rounded-xl text-sm font-medium border border-slate-800">
        <button id="tab-login-btn" onclick="showAuthTab('login')" class="flex-1 py-2 rounded-lg bg-blue-600 text-white transition">Anmelden</button>
        <button id="tab-register-btn" onclick="showAuthTab('register')" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition">Registrieren</button>
      </div>

      <!-- Form Login -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Benutzername</label>
          <input type="text" id="login-user" required class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white focus:outline-none focus:border-blue-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Passwort</label>
          <input type="password" id="login-pass" required class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white focus:outline-none focus:border-blue-500 transition">
        </div>
        <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition">Anmelden</button>
      </form>

      <!-- Form Register -->
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Name / Benutzername</label>
          <input type="text" id="reg-name" required class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white focus:outline-none focus:border-blue-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Passwort festlegen</label>
          <input type="password" id="reg-pass" required class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white focus:outline-none focus:border-blue-500 transition">
        </div>
        <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition">Account Erstellen</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen" class="hidden min-h-screen flex flex-col">
    <header class="glass sticky top-0 z-40 border-b border-slate-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-blue-600/20 text-blue-400 rounded-xl">
            <i data-lucide="sparkles" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-wider text-white">MYLife</h1>
            <p id="user-greeting" class="text-xs text-slate-400">Hallo</p>
          </div>
        </div>

        <button onclick="handleLogout()" class="px-3 py-1.5 bg-rose-600/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-bold hover:bg-rose-600/30 transition">Abmelden</button>
      </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
      <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>
  </div>

  <script>
    let currentUser = null;

    const EXERCISE_CATALOG = {
      oberkoerper: {
        arme: [
          { id: 'liegestuetze', name: 'Liegestütze', kcalPerRep: 0.5 },
          { id: 'pullups', name: 'Pull-ups / Klimmzüge', kcalPerRep: 1.0 },
          { id: 'dips', name: 'Dips', kcalPerRep: 0.7 },
          { id: 'curls', name: 'Bizeps Curls', kcalPerRep: 0.4 }
        ],
        bauch_ruecken: [
          { id: 'crunches', name: 'Crunches / Sit-ups', kcalPerRep: 0.3 },
          { id: 'plank', name: 'Plank (Sekunden)', kcalPerRep: 0.15 },
          { id: 'legraises', name: 'Leg Raises', kcalPerRep: 0.4 },
          { id: 'supermans', name: 'Supermans', kcalPerRep: 0.3 }
        ]
      },
      unterkoerper: {
        huefte: [
          { id: 'glutebridge', name: 'Glute Bridges', kcalPerRep: 0.4 },
          { id: 'hipthrust', name: 'Hip Thrusts', kcalPerRep: 0.6 },
          { id: 'swings', name: 'Kettlebell Swings', kcalPerRep: 0.8 }
        ],
        oberschenkel_waden: [
          { id: 'squats', name: 'Squats / Kniebeugen', kcalPerRep: 0.6 },
          { id: 'lunges', name: 'Lunges / Ausfallschritte', kcalPerRep: 0.5 },
          { id: 'calfraises', name: 'Calf Raises / Wadenheben', kcalPerRep: 0.3 },
          { id: 'jumpsquats', name: 'Jump Squats', kcalPerRep: 0.9 }
        ]
      }
    };

    window.onload = function() {
      lucide.createIcons();
      checkAuthSession();
    };

    function checkAuthSession() {
      const savedUser = localStorage.getItem('mylife_active_user');
      if (savedUser) {
        currentUser = JSON.parse(localStorage.getItem('mylife_user_' + savedUser));
        if (currentUser) {
          showApp();
          return;
        }
      }
      showAuthScreen();
    }

    function showAuthTab(tab) {
      document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
      document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
      document.getElementById('tab-login-btn').className = tab === 'login' ? 'flex-1 py-2 rounded-lg bg-blue-600 text-white transition' : 'flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition';
      document.getElementById('tab-register-btn').className = tab === 'register' ? 'flex-1 py-2 rounded-lg bg-blue-600 text-white transition' : 'flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition';
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const pass = document.getElementById('reg-pass').value;

      if (!name || !pass) return;

      currentUser = {
        username: name.toLowerCase(),
        password: pass,
        profile: { name: name },
        fitnessLogs: []
      };

      saveUserData();
      localStorage.setItem('mylife_active_user', currentUser.username);
      showApp();
    }

    function handleLogin(e) {
      e.preventDefault();
      const name = document.getElementById('login-user').value.trim().toLowerCase();
      const pass = document.getElementById('login-pass').value;

      const userData = localStorage.getItem('mylife_user_' + name);
      if (!userData) return alert('Benutzer nicht gefunden!');

      const user = JSON.parse(userData);
      if (user.password !== pass) return alert('Falsches Passwort!');

      currentUser = user;
      localStorage.setItem('mylife_active_user', currentUser.username);
      showApp();
    }

    function handleLogout() {
      localStorage.removeItem('mylife_active_user');
      currentUser = null;
      showAuthScreen();
    }

    function saveUserData() {
      if (currentUser) {
        localStorage.setItem('mylife_user_' + currentUser.username, JSON.stringify(currentUser));
      }
    }

    function showAuthScreen() {
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('app-screen').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('user-greeting').innerText = 'Hallo, ' + currentUser.profile.name;
      renderDashboard();
    }

    function renderDashboard() {
      const grid = document.getElementById('dashboard-grid');
      grid.innerHTML = `
        <div class="glass rounded-3xl p-6 border border-slate-800 space-y-4 col-span-1 md:col-span-2 lg:col-span-3">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2">
              <i data-lucide="dumbbell" class="text-blue-400 w-6 h-6"></i>
              <h3 class="font-bold text-white text-xl">Krafttraining & Multi-Routine</h3>
            </div>
            <span class="text-xs text-blue-400 bg-blue-600/10 border border-blue-500/20 px-3 py-1 rounded-full font-medium">Ziel: Fit bleiben & Reps steigern</span>
          </div>
          ${renderFitnessContent()}
        </div>
      `;

      lucide.createIcons();
      updateSubCatOptions();
      renderFitnessLogs();
    }

    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }

    function renderFitnessContent() {
      const today = getTodayString();

      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- LINKS: MULTI-EINGABE -->
          <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-4">
            <span class="text-xs font-bold uppercase text-slate-400 block tracking-wider">Multi-Übung Eintragen</span>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-[10px] text-slate-400 mb-1">Bereich</label>
                <select id="fit-cat" onchange="updateSubCatOptions()" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
                  <option value="oberkoerper">Oberkörper</option>
                  <option value="unterkoerper">Unterkörper</option>
                </select>
              </div>
              <div>
                <label class="block text-[10px] text-slate-400 mb-1">Muskelgruppe</label>
                <select id="fit-subcat" onchange="renderMultiExerciseList()" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
                </select>
              </div>
            </div>

            <!-- DYNAMISCHE LISTE MIT CHECKBOXEN -->
            <div class="space-y-2">
              <label class="block text-[10px] text-slate-400">Übungen auswählen & Reps eintragen:</label>
              <div id="multi-exercise-list" class="space-y-2 bg-slate-950 p-3 rounded-xl border border-slate-800/80 max-h-56 overflow-y-auto">
              </div>
            </div>

            <div class="grid grid-cols-3 gap-2">
              <div>
                <label class="block text-[10px] text-slate-400 mb-1">Dauer (Minuten)</label>
                <input type="number" id="fit-duration" placeholder="z. B. 30" class="w-full bg-slate-950 border border-slate-700 p-2 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
              </div>
              <div>
                <label class="block text-[10px] text-slate-400 mb-1">Geplant</label>
                <input type="text" value="1 Std." class="w-full bg-slate-950/50 border border-slate-800 p-2 rounded-xl text-xs text-slate-500" readonly>
              </div>
              <div>
                <label class="block text-[10px] text-slate-400 mb-1">Datum</label>
                <input type="date" id="fit-date" value="${today}" class="w-full bg-slate-950 border border-slate-700 p-2 rounded-xl text-xs text-white">
              </div>
            </div>

            <button onclick="saveMultiFitnessLog()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20">
              <i data-lucide="check-circle-2" class="w-4 h-4"></i> Ausgewählte Übungen Speichern
            </button>
          </div>

          <!-- RECHTS: DYNAMISCHE ANALYSE -->
          <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-3">
            <span class="text-xs font-bold uppercase text-slate-400 block tracking-wider">Trainingsverlauf & Steigerung</span>
            <div id="fitness-history-list" class="space-y-2.5 max-h-[420px] overflow-y-auto pr-1"></div>
          </div>
        </div>
      `;
    }

    function updateSubCatOptions() {
      const cat = document.getElementById('fit-cat').value;
      const subCatSelect = document.getElementById('fit-subcat');
      if (!subCatSelect) return;

      subCatSelect.innerHTML = cat === 'oberkoerper' 
        ? `<option value="arme">Arme</option><option value="bauch_ruecken">Bauch & Rücken</option>`
        : `<option value="huefte">Hüfte</option><option value="oberschenkel_waden">Oberschenkel & Waden</option>`;

      renderMultiExerciseList();
    }

    function renderMultiExerciseList() {
      const cat = document.getElementById('fit-cat').value;
      const subcat = document.getElementById('fit-subcat').value;
      const container = document.getElementById('multi-exercise-list');
      if (!container) return;

      const exercises = EXERCISE_CATALOG[cat][subcat] || [];
      
      container.innerHTML = exercises.map(ex => `
        <div class="flex items-center justify-between gap-3 bg-slate-900/90 p-2 rounded-lg border border-slate-800">
          <label class="flex items-center gap-2.5 cursor-pointer text-xs text-slate-200 flex-1">
            <input type="checkbox" id="chk-${ex.id}" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0 cursor-pointer">
            <span class="font-medium">${ex.name}</span>
          </label>
          <div class="flex items-center gap-1.5 w-28">
            <input type="number" id="rep-${ex.id}" placeholder="Anzahl" class="w-full bg-slate-950 border border-slate-700 px-2 py-1 rounded-lg text-xs text-white text-right focus:outline-none focus:border-blue-500">
            <span class="text-[10px] text-slate-500">Reps</span>
          </div>
        </div>
      `).join('');
    }

    function saveMultiFitnessLog() {
      const cat = document.getElementById('fit-cat').value;
      const subcat = document.getElementById('fit-subcat').value;
      const duration = parseInt(document.getElementById('fit-duration').value) || 0;
      const date = document.getElementById('fit-date').value || getTodayString();

      if (duration <= 0) {
        return alert('Bitte gib die benötigte Zeit (Dauer in Minuten) an!');
      }

      const exercises = EXERCISE_CATALOG[cat][subcat] || [];
      const selectedWorkouts = [];

      exercises.forEach(ex => {
        const chk = document.getElementById(`chk-${ex.id}`);
        const repInput = document.getElementById(`rep-${ex.id}`);

        if (chk && chk.checked) {
          const reps = parseInt(repInput.value) || 0;
          if (reps > 0) {
            selectedWorkouts.push({
              exercise: ex.name,
              reps: reps,
              kcalBurned: Math.round(reps * ex.kcalPerRep)
            });
          }
        }
      });

      if (selectedWorkouts.length === 0) {
        return alert('Bitte wähle mindestens eine Übung aus und trage die Anzahl der Wiederholungen ein!');
      }

      if (!currentUser.fitnessLogs) currentUser.fitnessLogs = [];

      currentUser.fitnessLogs.push({
        id: Date.now(),
        date,
        duration,
        workouts: selectedWorkouts
      });

      saveUserData();
      renderFitnessLogs();
      renderMultiExerciseList();
      document.getElementById('fit-duration').value = '';
    }

    function renderFitnessLogs() {
      const container = document.getElementById('fitness-history-list');
      if (!container) return;

      const logs = currentUser.fitnessLogs || [];
      if (logs.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 italic">Noch keine Workouts eingetragen.</p>`;
        return;
      }

      container.innerHTML = logs.slice().reverse().map((log, origIdx) => {
        const actualIdx = logs.length - 1 - origIdx;
        const totalKcal = log.workouts.reduce((sum, w) => sum + w.kcalBurned, 0);

        const workoutItemsHTML = log.workouts.map(w => {
          let prevReps = null;
          for (let i = actualIdx - 1; i >= 0; i--) {
            const found = logs[i].workouts.find(item => item.exercise === w.exercise);
            if (found) {
              prevReps = found.reps;
              break;
            }
          }

          let analysisBadge = '';
          if (prevReps !== null) {
            const diff = w.reps - prevReps;
            if (diff > 0) analysisBadge = `<span class="text-emerald-400 font-bold">↑ +${diff} Steigerung</span>`;
            else if (diff < 0) analysisBadge = `<span class="text-rose-400 font-bold">↓ ${diff} Reps</span>`;
            else analysisBadge = `<span class="text-slate-400">0 Steigerung</span>`;
          } else {
            analysisBadge = `<span class="text-blue-400 italic">1. Mal (Basis)</span>`;
          }

          return `
            <div class="flex items-center justify-between text-xs bg-slate-900/60 p-2 rounded-lg border border-slate-800/60">
              <span class="font-medium text-slate-200">${w.exercise}</span>
              <div class="flex items-center gap-3">
                <span class="font-bold text-blue-400">${w.reps} Reps</span>
                <span class="text-[10px] text-amber-400">🔥 ${w.kcalBurned} kcal</span>
                <div class="text-[10px] bg-slate-950 px-2 py-0.5 rounded border border-slate-800">${analysisBadge}</div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2.5">
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-2">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-white">${log.date}</span>
                <span class="text-[10px] bg-blue-600/20 text-blue-400 px-2 py-0.5 rounded-full font-medium">${log.duration} Min. Dauer</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-amber-400">Gesamt: 🔥 ${totalKcal} kcal</span>
                <button onclick="deleteFitnessLog(${actualIdx})" class="text-slate-600 hover:text-rose-400"><i data-lucide="x" class="w-4 h-4"></i></button>
              </div>
            </div>

            <div class="space-y-1.5">
              ${workoutItemsHTML}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function deleteFitnessLog(idx) {
      currentUser.fitnessLogs.splice(idx, 1);
      saveUserData();
      renderFitnessLogs();
    }
  </script>
</body>
</html>
