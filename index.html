<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYLife – Personal Dashboard & Growth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="h-full font-sans antialiased selection:bg-blue-500 selection:text-white">

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
    <div class="glass w-full max-w-md p-8 rounded-3xl shadow-2xl space-y-6 border border-slate-800">
      <div class="text-center space-y-2">
        <div class="inline-flex p-3 bg-blue-600/20 text-blue-400 rounded-2xl mb-2">
          <i data-lucide="sparkles" class="w-8 h-8"></i>
        </div>
        <h1 class="text-3xl font-black tracking-tight text-white">MYLife</h1>
        <p class="text-slate-400 text-sm">Dein persönliches Entwicklungs-Dashboard</p>
      </div>

      <div class="flex p-1 bg-slate-900/80 rounded-xl text-sm font-medium border border-slate-800">
        <button id="tab-login-btn" onclick="showAuthTab('login')" class="flex-1 py-2 rounded-lg bg-blue-600 text-white transition">Anmelden</button>
        <button id="tab-register-btn" onclick="showAuthTab('register')" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition">Registrieren</button>
      </div>

      <!-- Form Login -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Benutzername</label>
          <input type="text" id="login-user" required class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Passwort</label>
          <input type="password" id="login-pass" required class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
        </div>
        <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition">Anmelden</button>
      </form>

      <!-- Form Register -->
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Name / Benutzername</label>
          <input type="text" id="reg-name" required class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Schule / Schulsystem</label>
          <select id="reg-school" class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white focus:outline-none focus:border-blue-500 transition">
            <option value="WMS">WMS (Wirtschaftsmittelschule EFZ/BM)</option>
            <option value="Andere">Andere Schule</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Passwort festlegen</label>
          <input type="password" id="reg-pass" required class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
        </div>
        <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition">Account Erstellen</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen" class="hidden min-h-screen flex flex-col">
    <header class="glass sticky top-0 z-40 border-b border-slate-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-blue-600/20 text-blue-400 rounded-xl">
            <i data-lucide="sparkles" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-wider text-white">MYLife</h1>
            <p id="user-greeting" class="text-xs text-slate-400">Hallo</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button onclick="openAddModuleModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-lg shadow-blue-600/20">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Modul hinzufügen</span>
          </button>
          
          <button onclick="openProfileModal()" class="flex items-center gap-2 p-1.5 bg-slate-900 border border-slate-800 rounded-xl hover:border-blue-500 transition">
            <img id="nav-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-8 h-8 rounded-lg object-cover">
            <span id="nav-username" class="text-sm font-medium text-slate-200 hidden md:inline">Profil</span>
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
      <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>
  </div>

  <!-- MODAL: MODULE VERWALTEN -->
  <div id="modal-add-module" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-xl p-6 rounded-3xl border border-slate-800 space-y-6">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h3 class="text-xl font-bold text-white flex items-center gap-2">
          <i data-lucide="layout-grid" class="text-blue-400"></i> Module Verwalten
        </h3>
        <button onclick="closeModal('modal-add-module')" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
      </div>
      <div id="available-modules-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-96 overflow-y-auto p-1"></div>
    </div>
  </div>

  <!-- MODAL: STECKBRIEF / PROFIL -->
  <div id="modal-profile" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-xl p-6 rounded-3xl border border-slate-800 space-y-6 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h3 class="text-xl font-bold text-white flex items-center gap-2">
          <i data-lucide="user" class="text-blue-400"></i> Mein Steckbrief
        </h3>
        <button onclick="closeModal('modal-profile')" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
      </div>

      <form onsubmit="saveProfile(event)" class="space-y-4">
        <div class="flex items-center gap-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
          <img id="edit-profile-img-preview" src="" class="w-16 h-16 rounded-2xl object-cover bg-slate-800 border border-slate-700">
          <div class="flex-1 space-y-2">
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Profilbild URL</label>
              <input type="text" id="edit-profile-pic" oninput="updateProfilePicPreview(this.value)" placeholder="https://..." class="w-full px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Name</label>
            <input type="text" id="edit-profile-name" required class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Alter</label>
            <input type="number" id="edit-profile-age" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white">
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 font-bold text-white rounded-xl transition">Speichern</button>
          <button type="button" onclick="handleLogout()" class="px-4 py-3 bg-rose-600/20 text-rose-400 border border-rose-500/30 rounded-xl font-bold hover:bg-rose-600/30 transition">Abmelden</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;
    const DEFAULT_AVATAR = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100';

    // Übungskatalog mit durchschnittlichem Kalorienverbrauch pro 10 Wiederholungen
    const EXERCISE_CATALOG = {
      oberkoerper: {
        arme: [
          { name: 'Liegestütze', kcalPerRep: 0.5 },
          { name: 'Pull-ups / Klimmzüge', kcalPerRep: 1.0 },
          { name: 'Dips', kcalPerRep: 0.7 },
          { name: 'Bizeps Curls', kcalPerRep: 0.4 }
        ],
        bauch_ruecken: [
          { name: 'Crunches / Sit-ups', kcalPerRep: 0.3 },
          { name: 'Plank (Sekunden statt Reps)', kcalPerRep: 0.15 },
          { name: 'Leg Raises', kcalPerRep: 0.4 },
          { name: 'Supermans', kcalPerRep: 0.3 }
        ]
      },
      unterkoerper: {
        huefte: [
          { name: 'Glute Bridges / Beckenheben', kcalPerRep: 0.4 },
          { name: 'Hip Thrusts', kcalPerRep: 0.6 },
          { name: 'Kettlebell Swings', kcalPerRep: 0.8 }
        ],
        oberschenkel_waden: [
          { name: 'Squats / Kniebeugen', kcalPerRep: 0.6 },
          { name: 'Lunges / Ausfallschritte', kcalPerRep: 0.5 },
          { name: 'Calf Raises / Wadenheben', kcalPerRep: 0.3 },
          { name: 'Jump Squats', kcalPerRep: 0.9 }
        ]
      }
    };

    const MODULE_DEFINITIONS = [
      { id: 'fitness', name: 'Krafttraining & Routine', icon: 'dumbbell', desc: 'Ziel: Fit bleiben, Reps steigern & Kalorien-Analyse' },
      { id: 'nutrition', name: 'Ernährung & Gesundheit', icon: 'apple', desc: 'Nährwert-Tracker & Health-Score' },
      { id: 'wms_grades', name: 'WMS Notensystem', icon: 'graduation-cap', desc: 'Notenverwaltung & Bestehensregeln' }
    ];

    window.onload = function() {
      lucide.createIcons();
      checkAuthSession();
    };

    function checkAuthSession() {
      const savedUser = localStorage.getItem('mylife_active_user');
      if (savedUser) {
        currentUser = JSON.parse(localStorage.getItem('mylife_user_' + savedUser));
        if (currentUser) {
          showApp();
          return;
        }
      }
      showAuthScreen();
    }

    function showAuthTab(tab) {
      document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
      document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const pass = document.getElementById('reg-pass').value;

      if (!name || !pass) return;

      currentUser = {
        username: name.toLowerCase(),
        password: pass,
        profile: { name: name, pic: DEFAULT_AVATAR },
        activeModules: ['fitness', 'nutrition'],
        fitnessLogs: []
      };

      saveUserData();
      localStorage.setItem('mylife_active_user', currentUser.username);
      showApp();
    }

    function handleLogin(e) {
      e.preventDefault();
      const name = document.getElementById('login-user').value.trim().toLowerCase();
      const pass = document.getElementById('login-pass').value;

      const userData = localStorage.getItem('mylife_user_' + name);
      if (!userData) return alert('Benutzer nicht gefunden!');

      const user = JSON.parse(userData);
      if (user.password !== pass) return alert('Falsches Passwort!');

      currentUser = user;
      localStorage.setItem('mylife_active_user', currentUser.username);
      showApp();
    }

    function handleLogout() {
      localStorage.removeItem('mylife_active_user');
      currentUser = null;
      closeModal('modal-profile');
      showAuthScreen();
    }

    function saveUserData() {
      if (currentUser) {
        localStorage.setItem('mylife_user_' + currentUser.username, JSON.stringify(currentUser));
      }
    }

    function showAuthScreen() {
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('app-screen').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      updateNavProfile();
      renderDashboard();
    }

    function updateNavProfile() {
      document.getElementById('user-greeting').innerText = 'Hallo, ' + currentUser.profile.name;
      document.getElementById('nav-username').innerText = currentUser.profile.name;
      document.getElementById('nav-avatar').src = currentUser.profile.pic || DEFAULT_AVATAR;
    }

    function renderDashboard() {
      const grid = document.getElementById('dashboard-grid');
      grid.innerHTML = '';

      currentUser.activeModules.forEach(modId => {
        const card = document.createElement('div');
        card.className = "glass rounded-3xl p-6 border border-slate-800 space-y-4 flex flex-col justify-between";
        card.innerHTML = getModuleHTML(modId);
        grid.appendChild(card);
      });

      lucide.createIcons();

      if (currentUser.activeModules.includes('fitness')) {
        updateSubCatOptions();
        renderFitnessLogs();
      }
    }

    function getModuleHTML(modId) {
      const modDef = MODULE_DEFINITIONS.find(m => m.id === modId);
      let contentHTML = modId === 'fitness' ? renderFitnessContent() : `<p class="text-xs text-slate-400">${modDef.desc}</p>`;

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2">
              <i data-lucide="${modDef.icon}" class="text-blue-400 w-5 h-5"></i>
              <h3 class="font-bold text-white text-lg">${modDef.name}</h3>
            </div>
            <button onclick="removeModule('${modId}')" class="text-slate-500 hover:text-rose-400 text-xs transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
          <div>${contentHTML}</div>
        </div>
      `;
    }

    // ---------------- FITNESS MODUL LOGIK ----------------
    function getTodayString() {
      const today = new Date();
      return today.toISOString().split('T')[0];
    }

    function renderFitnessContent() {
      const today = getTodayString();

      return `
        <div class="space-y-4">
          <div class="p-3 bg-blue-600/10 border border-blue-500/20 rounded-2xl flex items-center justify-between text-xs">
            <div>
              <span class="font-bold text-blue-400 block">Ziel: Fit bleiben & Wiederholungen steigern</span>
              <span class="text-slate-400">Anwendung mit Kalorien- & Steigerungsanalyse</span>
            </div>
            <i data-lucide="target" class="w-5 h-5 text-blue-400"></i>
          </div>

          <!-- INPUT FORMULAR -->
          <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800 space-y-3">
            <span class="text-[10px] font-bold uppercase text-slate-400 block">Neues Training eintragen</span>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] text-slate-400 mb-1">Bereich</label>
                <select id="fit-cat" onchange="updateSubCatOptions()" class="w-full bg-slate-950 border border-slate-700 p-2 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
                  <option value="oberkoerper">Oberkörper</option>
                  <option value="unterkoerper">Unterkörper</option>
                </select>
              </div>
              <div>
                <label class="block text-[10px] text-slate-400 mb-1">Muskelgruppe</label>
                <select id="fit-subcat" onchange="updateExerciseOptions()" class="w-full bg-slate-950 border border-slate-700 p-2 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
                </select>
              </div>
            </div>

            <div>
              <label class="block text-[10px] text-slate-400 mb-1">Spezifische Übung</label>
              <select id="fit-exercise" class="w-full bg-slate-950 border border-slate-700 p-2 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
              </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] text-slate-400 mb-1">Anzahl (Wiederholungen)</label>
                <input type="number" id="fit-reps" placeholder="z. B. 30" class="w-full bg-slate-950 border border-slate-700 p-2 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
              </div>
              <div>
                <label class="block text-[10px] text-slate-400 mb-1">Dauer (Minuten)</label>
                <input type="number" id="fit-duration" placeholder="z. B. 20" class="w-full bg-slate-950 border border-slate-700 p-2 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] text-slate-400 mb-1">Geplante Zeit</label>
                <input type="text" id="fit-planned" value="1 Stunde" class="w-full bg-slate-950/50 border border-slate-800 p-2 rounded-xl text-xs text-slate-400" readonly>
              </div>
              <div>
                <label class="block text-[10px] text-slate-400 mb-1">Datum</label>
                <input type="date" id="fit-date" value="${today}" class="w-full bg-slate-950 border border-slate-700 p-1.5 rounded-xl text-xs text-white">
              </div>
            </div>

            <button onclick="saveFitnessLog()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white rounded-xl transition flex items-center justify-center gap-1.5">
              <i data-lucide="plus-circle" class="w-4 h-4"></i> Workout Eintragen & Analysieren
            </button>
          </div>

          <!-- VERLAUF & ANALYSE -->
          <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800 space-y-2.5">
            <span class="text-[10px] font-bold uppercase text-slate-400 block">Dauerhafte Analyse & Verlauf</span>
            <div id="fitness-history-list" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
          </div>
        </div>
      `;
    }

    function updateSubCatOptions() {
      const cat = document.getElementById('fit-cat').value;
      const subCatSelect = document.getElementById('fit-subcat');
      if (!subCatSelect) return;

      subCatSelect.innerHTML = cat === 'oberkoerper' 
        ? `<option value="arme">Arme</option><option value="bauch_ruecken">Bauch & Rücken</option>`
        : `<option value="huefte">Hüfte</option><option value="oberschenkel_waden">Oberschenkel & Waden</option>`;

      updateExerciseOptions();
    }

    function updateExerciseOptions() {
      const cat = document.getElementById('fit-cat').value;
      const subcat = document.getElementById('fit-subcat').value;
      const exSelect = document.getElementById('fit-exercise');
      if (!exSelect) return;

      exSelect.innerHTML = '';
      const list = EXERCISE_CATALOG[cat][subcat] || [];
      list.forEach(item => {
        exSelect.innerHTML += `<option value="${item.name}">${item.name}</option>`;
      });
    }

    function getKcalPerRep(exerciseName) {
      for (let cat in EXERCISE_CATALOG) {
        for (let sub in EXERCISE_CATALOG[cat]) {
          const found = EXERCISE_CATALOG[cat][sub].find(e => e.name === exerciseName);
          if (found) return found.kcalPerRep;
        }
      }
      return 0.5; // Standard-Wert
    }

    function saveFitnessLog() {
      const cat = document.getElementById('fit-cat').value;
      const subcat = document.getElementById('fit-subcat').value;
      const exercise = document.getElementById('fit-exercise').value;
      const reps = parseInt(document.getElementById('fit-reps').value) || 0;
      const duration = parseInt(document.getElementById('fit-duration').value) || 0;
      const date = document.getElementById('fit-date').value || getTodayString();

      if (reps <= 0 || duration <= 0) {
        return alert('Bitte gib eine gültige Anzahl an Wiederholungen und die benötigte Zeit an!');
      }

      const kcalBurned = Math.round(reps * getKcalPerRep(exercise));
      const speed = parseFloat((reps / duration).toFixed(2)); // Reps pro Minute

      if (!currentUser.fitnessLogs) currentUser.fitnessLogs = [];

      currentUser.fitnessLogs.push({
        id: Date.now(),
        date,
        cat,
        subcat,
        exercise,
        reps,
        duration,
        kcalBurned,
        speed
      });

      saveUserData();
      renderFitnessLogs();

      document.getElementById('fit-reps').value = '';
      document.getElementById('fit-duration').value = '';
    }

    function renderFitnessLogs() {
      const container = document.getElementById('fitness-history-list');
      if (!container) return;

      const logs = currentUser.fitnessLogs || [];
      if (logs.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 italic">Noch keine Workouts eingetragen.</p>`;
        return;
      }

      // Anzeige chronologisch von neu nach alt
      container.innerHTML = logs.slice().reverse().map((log, origIdx) => {
        const actualIdx = logs.length - 1 - origIdx;
        
        // Finde vorherige Workouts der SELBEN Übung für die Steigerungs-Analyse
        const previousLogs = logs.slice(0, actualIdx).filter(l => l.exercise === log.exercise);
        const lastLog = previousLogs.length > 0 ? previousLogs[previousLogs.length - 1] : null;

        let analysisHTML = '';
        if (lastLog) {
          const repsDiff = log.reps - lastLog.reps;
          const speedDiff = parseFloat((log.speed - lastLog.speed).toFixed(2));

          let repStatus = repsDiff > 0 
            ? `<span class="text-emerald-400 font-bold">↑ +${repsDiff} Reps Steigerung</span>`
            : repsDiff < 0 
            ? `<span class="text-rose-400 font-bold">↓ ${repsDiff} Reps weniger</span>`
            : `<span class="text-slate-400">0 Steigerung (Gleich zum Vortag)</span>`;

          let speedStatus = speedDiff > 0 
            ? `<span class="text-emerald-400">⚡ Schneller (${speedDiff} Reps/Min)</span>`
            : speedDiff < 0 
            ? `<span class="text-rose-400">🐢 Langsamer (${speedDiff} Reps/Min)</span>`
            : `<span class="text-slate-400">Gleiches Tempo</span>`;

          analysisHTML = `
            <div class="mt-2 pt-2 border-t border-slate-800/80 text-[10px] space-y-1">
              <div class="flex items-center justify-between">
                <span class="text-slate-400">Vergleich zum letzten Mal:</span>
                <div>${repStatus}</div>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-slate-400">Geschwindigkeit:</span>
                <div>${speedStatus}</div>
              </div>
            </div>
          `;
        } else {
          analysisHTML = `
            <div class="mt-2 pt-2 border-t border-slate-800/80 text-[10px] text-blue-400 flex items-center justify-between">
              <span>Status: 1. Workout (Basiswert)</span>
              <span class="font-bold">0 Steigerung</span>
            </div>
          `;
        }

        return `
          <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-1 text-xs">
            <div class="flex items-center justify-between">
              <span class="font-bold text-white">${log.exercise}</span>
              <div class="flex items-center gap-2">
                <span class="text-[10px] text-slate-500">${log.date}</span>
                <button onclick="deleteFitnessLog(${actualIdx})" class="text-slate-600 hover:text-rose-400"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
              </div>
            </div>

            <div class="flex items-center gap-2 text-[11px] pt-1">
              <span class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded-lg font-bold">${log.reps} Reps</span>
              <span class="bg-slate-900 text-slate-300 border border-slate-800 px-2 py-0.5 rounded-lg">${log.duration} Min.</span>
              <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-lg font-semibold">🔥 ca. ${log.kcalBurned} kcal</span>
            </div>

            ${analysisHTML}
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function deleteFitnessLog(idx) {
      currentUser.fitnessLogs.splice(idx, 1);
      saveUserData();
      renderFitnessLogs();
    }

    // GENERAL APP UTILS
    function openAddModuleModal() {
      document.getElementById('modal-add-module').classList.remove('hidden');
    }

    function openProfileModal() {
      document.getElementById('edit-profile-name').value = currentUser.profile.name || '';
      document.getElementById('edit-profile-pic').value = currentUser.profile.pic || '';
      document.getElementById('modal-profile').classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }
  </script>
</body>
</html>
